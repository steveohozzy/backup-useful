<!-- Category tiles -->
 <style type="text/css">
    .category-roundels {
        padding: 10px 0 20px;
        background-color: #dbe3ff;
    }

    .category-roundels .carousel {
        padding: 0 20px;
        max-width: 980px;
        margin: 0 auto;
    }

    .category-roundels .carousel .item {
        padding: 0;
    }

    .category-roundels .carousel-cell {
        width: 31%;
        padding-top: 10px;
    }

    .category-roundels .carousel-cell,
    .category-roundels a,
    .category-roundels img {
        aspect-ratio: 1/1;
    }

    .category-roundels img {
        width: 70%;
        margin: 0 10px !important;
    }

    .category-roundels a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-radius: 8px;
        padding: 10px 0;
        background-color: #fff;
        color: #00548B;
        text-decoration: none;
        font-size: 10px;
        font-family: "Nunito Bold","Tahoma Bold",sans-serif;
        font-weight: bold;
        color: #00548B;
        margin: 0 10px 0 0;
        box-shadow: 0 0 5px rgba(3,33,33,.05);
        letter-spacing: 0.5px;
        transition: all 0.3s;
    }

    .category-roundels a:hover {
        box-shadow: 0 0 18px rgba(33,33,33,.15);
        transform: translateY(-5px);
    }

    .category-roundels .flickity-button,
    .category-roundels .flickity-page-dots {
        display: none;
    }

    @media (min-width: 768px) {
        .category-roundels .carousel-cell {
            width: 22%;
        }

        .category-roundels a {
            font-size: 14px
        }
    }

    @media (min-width: 1024px) {
        .category-roundels a {
            font-size: 16px
        }
    }
    
 </style>
