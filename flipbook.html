<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style>


    .ts-flipbook-app {
        width: 100%;
        max-width: 100%;
        position: relative;
        box-sizing: border-box;
        padding: 20px;
        background-color: rgb(39, 87, 159);
    }


    .ts-flipbook-app *,
    .ts-flipbook-app *::before,
    .ts-flipbook-app *::after {
        box-sizing: border-box;
    }


    .ts-flipbook-app .ts-flipbook-viewport {
        width: 100%;
        height: 80vh;

        min-height: 500px;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        overflow: hidden;
    }


    .ts-flipbook-app .ts-flipbook {
        width: 1000px;
        height: 700px;

        position: relative;

        flex-shrink: 0;
    }


    .ts-flipbook-app .ts-flipbook .ts-page {
        position: relative;

        background: #fff;

        overflow: hidden;

        user-select: none;
        -webkit-user-select: none;

        -webkit-touch-callout: none;
    }


    .ts-flipbook-app .ts-flipbook .ts-page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
  }

    .ts-flipbook-app .ts-hotspot {
        position: absolute;

        z-index: 20;

        display: block;

        cursor: pointer;

        text-decoration: none;
    }


    .ts-flipbook-app .ts-hotspot:hover {
        background: rgba(0, 102, 255, 0.2);
    }


    .ts-flipbook-app .ts-flip-corner {
        position: absolute;

        bottom: 0;

        width: 50px;
        height: 50px;

        z-index: 100;

        cursor: grab;

        touch-action: none;

        background: transparent;

        user-select: none;
        -webkit-user-select: none;
    }


    .ts-flipbook-app .ts-flip-corner:active {
        cursor: grabbing;
    }


    .ts-flipbook-app .ts-flip-corner-right {
        right: 0;
    }


    .ts-flipbook-app .ts-flip-corner-left {
        left: 0;
    }


    .ts-flipbook-app .ts-corner-curl {
        position: absolute;

        bottom: 0;

        width: 90px;
        height: 90px;

        opacity: 0;

        pointer-events: none;

        transition:
            opacity 0.12s ease,
            transform 0.12s ease;

        z-index: 101;
    }


    .ts-flipbook-app .ts-corner-curl-right {
        right: 0;

        transform-origin: bottom right;

        transform:
            rotate(0deg)
            scale(0.7);
    }


    .ts-flipbook-app .ts-corner-curl-left {
      left: 0;

      transform-origin: bottom left;

      transform:
          rotate(0deg)
          scale(0.7);
  }


    .ts-flipbook-app .ts-flip-corner:hover .ts-corner-curl {
        opacity: 1;

        transform:
            rotate(0deg)
            scale(1);
    }


    .ts-flipbook-app .ts-corner-curl::before {
        content: "";

        position: absolute;

        width: 100%;
        height: 100%;

        background:
            linear-gradient(
                135deg,
                transparent 0%,
                transparent 48%,
                rgba(0,0,0,0.08) 49%,
                rgba(255,255,255,0.96) 52%,
                #ffffff 100%
            );

        filter:
            drop-shadow(
                -3px -3px 5px rgba(0,0,0,0.15)
            );
    }


    .ts-flipbook-app .ts-corner-curl-right::before {
        clip-path:
            polygon(
                100% 0,
                100% 100%,
                0 100%
            );
    }


    .ts-flipbook-app .ts-corner-curl::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    background: #ffffff;

    filter:
        drop-shadow(
            -3px -3px 5px rgba(0,0,0,0.15)
        );
}


.ts-flipbook-app .ts-corner-curl-right::before {
    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}


.ts-flipbook-app .ts-corner-curl-left::before {
    background: #ffffff;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}
    
    .ts-flipbook-app .ts-flip-corner.is-active {
        cursor: grabbing;
    }


    .ts-flipbook-app .ts-flip-corner.is-active .ts-corner-curl {
        opacity: 1;

        transform:
            scale(1.12);
    }

    .ts-flipbook-app .ts-flip-corner.is-dragging .ts-corner-curl {
        opacity: 1;

        transform:
            scale(1.25);
    }

    .ts-flipbook-app .ts-controls {
        margin-top: 20px;

        display: flex;

        gap: 20px;

        align-items: center;
        justify-content: center;

        position: relative;

        z-index: 200;
    }


    .ts-flipbook-app .ts-control-button {
      transition: all 0.3s ease-in-out;
        appearance: none;
        -webkit-appearance: none;

        background: #537fa4;

        color: #fff;

        border: none;

        padding: 10px 20px;

        font-family: inherit;

        font-size: 1rem;

        font-weight: bold;

        line-height: 1.2;

        border-radius: 4px;

        cursor: pointer;

        text-decoration: none;

        outline: none;
    }


    .ts-flipbook-app .ts-control-button:hover {
        background: #fff;

        color: #537fa4;
    }


    .ts-flipbook-app .ts-control-button:focus {
        background: #fff;

        color: #537fa4;
    }


    .ts-flipbook-app .ts-page-counter {
        color: #fff;

        font-size: 1rem;

        font-weight: bold;

        white-space: nowrap;
    }

    @media (max-width: 767px) {

        .ts-flipbook-app .ts-flipbook-viewport {
            height: 75vh;

            min-height: 420px;
        }


        .ts-flipbook-app .ts-controls {
            gap: 12px;

            margin-top: 15px;
            margin-bottom: 15px;
        }


        .ts-flipbook-app .ts-control-button {
            padding: 9px 14px;

            font-size: 0.9rem;
        }


        .ts-flipbook-app .ts-page-counter {
            font-size: 0.9rem;
        }


        .ts-flipbook-app .ts-flip-corner {
            width: 120px;
            height: 120px;
        }

    }

</style>

(function () {

    "use strict";


    /* =========================================================
       PREVENT SMARTEDIT / CMS FROM INITIALISING THIS TWICE
    ========================================================= */

    var apps = document.querySelectorAll(
        '.ts-flipbook-app[data-ts-flipbook="true"]'
    );


    for (
        var appIndex = 0;
        appIndex < apps.length;
        appIndex++
    ) {

        initialiseFlipbook(
            apps[appIndex]
        );

    }


    /* =========================================================
       INITIALISE FLIPBOOK
    ========================================================= */

    function initialiseFlipbook(app) {

        if (!app) {
            return;
        }


        /*
         * If SmartEdit happens to execute this script more
         * than once, do not create another flipbook.
         */

        if (
            app.getAttribute(
                "data-ts-initialised"
            ) === "true"
        ) {

            return;

        }


        app.setAttribute(
            "data-ts-initialised",
            "true"
        );


        /* =====================================================
           WAIT FOR JQUERY + TURN.JS
        ===================================================== */

        waitForLibraries(
            function () {

                setupFlipbook(
                    app
                );

            }
        );

    }


    /* =========================================================
       WAIT FOR REQUIRED LIBRARIES
    ========================================================= */

    function waitForLibraries(callback) {

        var attempts = 0;

        var maxAttempts = 100;


        function check() {

            attempts++;


            if (
                window.jQuery &&
                window.jQuery.fn &&
                window.jQuery.fn.turn
            ) {

                callback();

                return;

            }


            if (
                attempts >=
                maxAttempts
            ) {

                console.warn(
                    "Turn.js could not be loaded."
                );

                return;

            }


            window.setTimeout(
                check,
                100
            );

        }


        check();

    }

        for (

            if ( pageLinks[i] ) { pageLinks[i].forEach( function (link) { /* ========================================= PAGE JUMP HOTSPOT ========================================= */ if ( typeof link.page === 'number' ) { pageContent += '<a ' + 'href="#" ' + 'class="ts-hotspot ts-page-hotspot" ' + 'data-target-page="' + link.page + '" ' + 'style="' + 'top:' + link.top + ';' + 'left:' + link.left + ';' + 'width:' + link.width + ';' + 'height:' + link.height + ';"' + '></a>'; } /* ========================================= NORMAL URL HOTSPOT ========================================= */ else if ( link.url ) { pageContent += '<a ' + 'href="' + link.url + '" ' + 'target="_blank" ' + 'rel="noopener noreferrer" ' + 'class="ts-hotspot" ' + 'style="' + 'top:' + link.top + ';' + 'left:' + link.left + ';' + 'width:' + link.width + ';' + 'height:' + link.height + ';"' + '></a>'; } } ); }

            active: false,

            pointerId: null,

        };


        /* =====================================================
           UPDATE COUNTER
        ===================================================== */

        function updatePageCounter() {

            var currentPage;


            try {

                currentPage =
                    $flipbook.turn(
                        'page'
                    );

            }
            catch (e) {

                currentPage = 1;

            }


            $pageCounter.text(

                'Page ' +
                currentPage +
                ' of ' +
                totalPages

            );

        }


        try {

            var PAGE_RATIO =
                1181 / 1594;


            function getFlipbookSize() {

                var viewportWidth =
                    $app.find('.ts-flipbook-viewport').width();

                var viewportHeight =
                    $app.find('.ts-flipbook-viewport').height();


                /* Leave a little breathing room */

                var maxHeight =
                    viewportHeight - 20;


                var maxWidth =
                    viewportWidth - 20;


                var pageWidth;
                var pageHeight;


                if (isMobile) {

                    /* =============================================
                      MOBILE = ONE PAGE
                    ============================================= */

                    pageHeight =
                        Math.min(
                            maxHeight,
                            1594
                        );

                    pageWidth =
                        pageHeight * PAGE_RATIO;


                    /* Don't let the page exceed the screen */

                    if (pageWidth > maxWidth) {

                        pageWidth =
                            maxWidth;

                        pageHeight =
                            pageWidth / PAGE_RATIO;

                    }

                }
                else {

                    /* =============================================
                      DESKTOP = TWO PAGES
                    ============================================= */

                    pageHeight =
                        Math.min(
                            maxHeight,
                            1594
                        );

                    pageWidth =
                        pageHeight * PAGE_RATIO;


                    /* Two pages side by side */

                    if (
                        pageWidth * 2 >
                        maxWidth
                    ) {

                        pageWidth =
                            maxWidth / 2;

                        pageHeight =
                            pageWidth / PAGE_RATIO;

                    }

                }


                return {

                    width:
                        isMobile
                            ? Math.round(pageWidth)
                            : Math.round(pageWidth * 2),

                    height:
                        Math.round(pageHeight)

                };

            }


            var flipbookSize =
                getFlipbookSize();


            /* =====================================================

            ===================================================== */

            try {

                $flipbook.turn({

                    height:

                    display:

                    autoCenter: true,

                    duration: 600,

                    elevation: 50,

                    gradients: true,

                    acceleration: true,

                    when: {

                        turned:
                            function () {

                                updatePageCounter();

                                window.setTimeout(
                                    buildCornerControls,
                                    30
                                );

                            }

                    }

                });

            }
            catch (e) {

                console.error(
                    "Flipbook initialisation failed:",
                    e
                );

                return;

            }

        }
        catch (e) {

            console.error(

        ===================================================== */

        function buildCornerControls() {

            $flipbook
                .find(
                    '.ts-flip-corner'
                )
                .remove();


            var currentPage;


            try {

                currentPage =
                    $flipbook.turn(
                        'page'
                    );

            }
            catch (e) {

                return;

            }


            /* =================================================
               NEXT CORNER
            ================================================= */

            if (
                currentPage <
                totalPages
            ) {

                addCorner(
                    'right',
                    'next'
                );

            }


            /* =================================================
               PREVIOUS CORNER
            ================================================= */

            if (
                currentPage >
                1
            ) {

                addCorner(
                    'left',
                    'previous'
                );

            }

        }


        /* =====================================================
           ADD CORNER
        ===================================================== */

        function addCorner(
            side,
            direction
        ) {

            var $corner =
                $('<div>');


            $corner.addClass(
                'ts-flip-corner'
            );


            $corner.addClass(
                'ts-flip-corner-' +
                side
            );


            $corner.attr(
                'data-direction',
                direction
            );


            /* =================================================
               CURL
            ================================================= */

            var $curl =
                $('<div>');


            $curl.addClass(
                'ts-corner-curl'
            );


            $curl.addClass(
                'ts-corner-curl-' +
                side
            );


            $corner.append(
                $curl
            );


            $flipbook.append(
                $corner
            );


            /* =================================================
               MOUSE ENTER
            ================================================= */

            $corner.on(
                'mouseenter.tsFlipbook',
                function () {

                    if (
                        side ===
                        'right'
                    ) {

                        try {

                            $flipbook.turn(
                                'peel',
                                'br'
                            );

                        }
                        catch (e) {}

                    }
                    else {

                        try {

                            $flipbook.turn(
                                'peel',
                                'bl'
                            );

                        }
                        catch (e) {}

                    }

                }
            );


            /* =================================================
               MOUSE LEAVE
            ================================================= */

            $corner.on(
                'mouseleave.tsFlipbook',
                function () {

                    if (
                        !dragState.dragging
                    ) {

                        try {

                            $flipbook.turn(
                                'peel',
                                false
                            );

                        }
                        catch (e) {}

                    }

                }
            );


            /* =================================================
               POINTER DOWN
            ================================================= */

            $corner.on(
                'pointerdown.tsFlipbook',
                function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    dragState.active =
                        true;

                    dragState.dragging =
                        false;

                    dragState.side =
                        side;

                    dragState.direction =
                        direction;

                    dragState.startX =
                        event.clientX;

                    dragState.startY =
                        event.clientY;

                    dragState.pointerId =
                        event.pointerId;

                    dragState.$corner =
                        $corner;


                    $corner.addClass(
                        'is-active'
                    );


                    if (
                        $corner[0] &&
                        $corner[0].setPointerCapture
                    ) {

                        try {

                            $corner[0].setPointerCapture(
                                event.pointerId
                            );

                        }
                        catch (e) {}

                    }

                }
            );


            /* =================================================
               POINTER MOVE
            ================================================= */

            $corner.on(
                'pointermove.tsFlipbook',
                function (event) {

                    if (
                        !dragState.active
                    ) {

                        return;

                    }


                    var dx =
                        event.clientX -
                        dragState.startX;


                    var dy =
                        event.clientY -
                        dragState.startY;


                    var distance =
                        Math.sqrt(
                            (dx * dx) +
                            (dy * dy)
                        );


                    if (
                        distance >
                        10
                    ) {

                        dragState.dragging =
                            true;


                        $corner.addClass(
                            'is-dragging'
                        );

                    }

                }
            );


            /* =================================================
               POINTER UP
            ================================================= */

            $corner.on(
                'pointerup.tsFlipbook',
                function (event) {

                    if (
                        !dragState.active
                    ) {

                        return;

                    }


                    var dx =
                        event.clientX -
                        dragState.startX;


                    var dy =
                        event.clientY -
                        dragState.startY;


                    var distance =
                        Math.sqrt(
                            (dx * dx) +
                            (dy * dy)
                        );


                    /* =========================================
                       REMOVE PEEL
                    ========================================= */

                    try {

                        $flipbook.turn(
                            'peel',
                            false
                        );

                    }
                    catch (e) {}


                    /* =========================================
                       REMOVE VISUAL STATES
                    ========================================= */

                    $corner.removeClass(
                        'is-active'
                    );


                    $corner.removeClass(
                        'is-dragging'
                    );


                    /* =========================================
                       SIMPLE CLICK
                    ========================================= */

                    if (
                        distance <
                        10
                    ) {

                        if (
                            direction ===
                            'next'
                        ) {

                            try {

                                $flipbook.turn(
                                    'next'
                                );

                            }
                            catch (e) {}

                        }
                        else {

                            try {

                                $flipbook.turn(
                                    'previous'
                                );

                            }
                            catch (e) {}

                        }

                    }


                    /* =========================================
                       DRAG
                    ========================================= */

                    else if (
                        distance >=
                        dragThreshold
                    ) {

                        var validDrag =
                            false;


                        /* =====================================
                           RIGHT CORNER

                           Drag left = next
                        ===================================== */

                        if (
                            direction ===
                            'next'
                        ) {

                            if (
                                side ===
                                'right' &&
                                dx < 0
                            ) {

                                validDrag =
                                    true;

                            }

                        }


                        /* =====================================
                           LEFT CORNER

                           Drag right = previous
                        ===================================== */

                        if (
                            direction ===
                            'previous'
                        ) {

                            if (
                                side ===
                                'left' &&
                                dx > 0
                            ) {

                                validDrag =
                                    true;

                            }

                        }


                        /* =====================================
                           TURN PAGE
                        ===================================== */

                        if (
                            validDrag
                        ) {

                            try {

                                if (
                                    direction ===
                                    'next'
                                ) {

                                    $flipbook.turn(
                                        'next'
                                    );

                                }
                                else {

                                    $flipbook.turn(
                                        'previous'
                                    );

                                }

                            }
                            catch (e) {}

                        }

                    }


                    /* =========================================
                       RESET DRAG STATE
                    ========================================= */

                    dragState.active =
                        false;

                    dragState.dragging =
                        false;

                    dragState.side =
                        null;

                    dragState.direction =
                        null;

                    dragState.pointerId =
                        null;

                    dragState.$corner =
                        null;

                }
            );


            /* =================================================
               POINTER CANCEL
            ================================================= */

            $corner.on(
                'pointercancel.tsFlipbook',
                function () {

                    dragState.active =
                        false;

                    dragState.dragging =
                        false;

                    dragState.side =
                        null;

                    dragState.direction =
                        null;

                    dragState.pointerId =
                        null;

                    dragState.$corner =
                        null;


                    $corner.removeClass(
                        'is-active'
                    );


                    $corner.removeClass(
                        'is-dragging'
                    );


                    try {

                        $flipbook.turn(
                            'peel',
                            false
                        );

                    }
                    catch (e) {}

                }
            );

        }

           INITIAL CORNERS
        ===================================================== */

        window.setTimeout(

           We DO NOT use:

               $(document).on('keydown'...)

           actual flipbook/app has focus.
        ===================================================== */

        $app.on(
            'keydown.tsFlipbook',
            function (event) {

                        target.tagName === 'INPUT' ||

                    event.keyCode === 37
                ) {

                }


                if (
                    event.keyCode === 39
                ) {

                    event.preventDefault();


                    try {

                        $flipbook.turn(
                            'next'
                        );

                    }
                    catch (e) {}

                }

            }
        );


        /* =====================================================
           MAKE APP FOCUSABLE

           This allows keyboard navigation without putting
           a global document keydown listener on the page.
        ===================================================== */

        $app.attr(
            'tabindex',
            '0'
        );


        $app.on(
            'click.tsFlipbook',
            function () {

                try {

                    this.focus();

                }
                catch (e) {}

            }
        );


        /* =====================================================
           RESIZE

           Scoped to window but ONLY changes this flipbook.
        ===================================================== */

        var resizeTimer = null;


        $(window).on(
            'resize.tsFlipbook',
            function () {

                if (
                    resizeTimer
                ) {

                    window.clearTimeout(
                        resizeTimer
                    );

                }


                resizeTimer =
                    window.setTimeout(
                        function () {

                            var mobileCheck =
                                $(window).width() < 768;


                            if (
                                mobileCheck !==
                                isMobile
                            ) {

                                isMobile =
                                    mobileCheck;


                                try {

                                    $flipbook.turn(
                                        'display',

                                        isMobile
                                            ? 'single'
                                            : 'double'
                                    );


                                    $flipbook.turn(
                                      'size',

                                      isMobile
                                          ? 371
                                          : 590,

                                      isMobile
                                          ? 500
                                          : 797
                                  );

                                }
                                catch (e) {}


                                window.setTimeout(
                                    buildCornerControls,
                                    100
                                );

                            }

                        },
                        150
                    );

            }
        );


        $app.on( 'click.tsFlipbookHotspot', '.ts-page-hotspot', function (event) { event.preventDefault(); event.stopPropagation(); var targetPage = parseInt( $(this).attr( 'data-target-page' ), 10 ); /* ============================================= CHECK TARGET PAGE ============================================= */ if ( isNaN(targetPage) ) { return; } if ( targetPage < 1 || targetPage > totalPages ) { return; } /* ============================================= JUMP TO PAGE ============================================= */ try { $flipbook.turn( 'page', targetPage ); } catch (e) { console.warn( 'Could not jump to flipbook page:', targetPage ); } } ); /* ===================================================== NORMAL URL HOTSPOTS Allow external product links to work normally, but stop them affecting SmartEdit. ===================================================== */ $app.on( 'click.tsFlipbookHotspot', '.ts-hotspot:not(.ts-page-hotspot)', function (event) { event.stopPropagation(); } );


    }


})();

</script>
