<style>
  .comp-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin: 0 auto;
    position: relative;
    max-width: 620px;
    border-radius: 8px;
    overflow: hidden;
    background-color: #fff;
    text-decoration: none;
  }
  .comp-container .media {
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
}

.comp-container .media img {
  width: 100%;
  height: auto;
  display: block;
}
  .comp-container-info {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #fff;
    padding: 20px 10px;
  }
  .comp-container-info .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background-color: #009e44;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px 10px 10px 0;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.3);
    border: 3px solid #dbe3ff;
    transition: all 0.3s;
    cursor: pointer;
    width: 100%;
    max-width: 295px;
  }

  .comp-container-info .hero-button:hover {
    background-color: #1f2b91;
    scale: 1.05;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
  }

  .comp-container-info .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .comp-container-info .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .comp-container-info .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .comp-container-info .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .comp-container-info .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: -3px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .comp-container-info .hero-button:hover .swoosh {
    width: 7px;
  }

  .comp-container-info .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .comp-container-info .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .comp-container .crayon {
    position: absolute;
    width: 85px;
  }

  .comp-container .crayon.left-crayon {
    left: -10px;
    bottom: 0;
    transform: rotate(10deg);
  }

  .comp-container .crayon.right-crayon {
    right: 30px;
    top: 30px;
    transform: rotate(25deg);
  }

  @media (min-width: 768px) {
    .comp-container .crayon {
      width: 137px;
    }

    .comp-container .crayon.left-crayon {
    left: -10px;
    bottom: 0;
    transform: rotate(0deg);
  }

  .comp-container .crayon.right-crayon {
    right: -5px;
    bottom: 0;
    top: unset;
    transform: rotate(0deg);
  }
  }

  
</style>
