<script>
var instaCarousel = new Flickity('.instagram-carousel',{
  cellAlign:'left',
  contain:true,
  wrapAround:true,
  pageDots:false
});

var socialCarousel = new Flickity('.social-carousel',{
  cellAlign:'left',
  contain:true,
  wrapAround:true,
  pageDots:false
});

function resizeCarousels(){
  setTimeout(function(){
    instaCarousel.resize();
    socialCarousel.resize();
  },1200);
}

window.addEventListener('load',resizeCarousels);
</script>

<script>
var flkty = new Flickity('.social-carousel', {
  cellAlign: 'left',
  contain: true,
  wrapAround: true,
  pageDots: false
});

function resizeCarousel(){
  setTimeout(function(){
    flkty.resize();
  }, 1000);
}

window.addEventListener('load', resizeCarousel);

// Instagram render callback
if (window.instgrm) {
  window.instgrm.Embeds.process();
  resizeCarousel();
}

// Facebook render callback
window.fbAsyncInit = function() {
  FB.XFBML.parse();
  resizeCarousel();
};
</script>

<script>
function fixFacebookEmbeds() {
  const fbPosts = document.querySelectorAll('.fb-post');
  fbPosts.forEach(post => {
    const iframe = post.querySelector('iframe');
    if (iframe) {
      iframe.style.width = '100%';
      iframe.style.height = '100%';
    }
    const innerSpan = post.querySelector('span');
    if(innerSpan){
      innerSpan.style.width = '100%';
      innerSpan.style.height = '100%';
    }
  });
}

// Call after FB SDK parses
window.fbAsyncInit = function() {
  FB.init({xfbml:true, version:'v19.0'});
  FB.XFBML.parse();

  // Wait a moment for iframe to appear
  setTimeout(() => {
    fixFacebookEmbeds();

    // Resize Flickity
    if (window.socialCarousel) socialCarousel.resize();
  }, 1500);
};
</script>
