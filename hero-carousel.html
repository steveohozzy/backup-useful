<!-- o Carousel -->
 <style type="text/css">
    .hero-panels {
        padding: 0 20px 30px 20px;
        background-color: #dbe3ff;
    }

    .carousel {
        max-width: 940px;
        margin: 0 auto;
    }

    .hero-panels .flickity-button {
        display: none;
    }

    .hero-panels .carousel-cell {
        width: 100%;
        height: 100%;
        counter-increment: carousel-cell;
        opacity: 100%;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 18px rgba(33,33,33,.15);
    }

    .hero-panels .carousel-cell.is-selected {
        opacity: 100%;
    }

    .hero-panels .carousel-cell .media {
        aspect-ratio: 335/188;
        border-radius: 8px;
        overflow: hidden;
    }

    .hero-panels .carousel-cell .media img,
    .hero-panels .carousel-cell .media iframe,
    .hero-panels .carousel-cell .media video {
        object-fit: cover;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 2;
    }

    .hero-panels .carousel-cell .hero-tile-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #FFD502;
        border-radius: 8px;
        position: relative;
        margin-top: -20px;
        padding: 40px 20px 20px 20px;
    }

    .hero-panels .carousel-cell .hero-tile-info.blue {
        background-color: #0057B8;
        color: #fff;
    }

    .hero-panels .carousel-cell .hero-tile-info .brand-logo {
        position: absolute;
        top: -32px;
        height: 40px;
        z-index: 2;
    }

    .hero-panels .carousel-cell .hero-tile-info .brand-logo img,
    .hero-panels .carousel-cell .hero-tile-info .brand-logo svg {
        height: 100%;
        width: auto;
    }

    .hero-panels .carousel-cell .hero-tile-info h2 {
        font-size: 18px;
        font-family: "Nunito Bold","Tahoma Bold",sans-serif;
        font-weight: bold;
        color: #00548B;
        margin: 0 0 20px;
    }

    .hero-panels .carousel-cell .hero-tile-info .hero-blurb {
        display: none;
        color: #00548B;
        font-size: 14px;
        font-weight: 200;
    }

    .hero-panels .carousel-cell .hero-tile-info.blue h2,
    .hero-panels .carousel-cell .hero-tile-info.blue .hero-blurb {
        color: #fff;
    }

    .hero-panels .flickity-viewport {
        aspect-ratio: 335/307;
    }

    .hero-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50px;
        background-color: #009E44;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
        padding: 10px 30px 10px 10px;
        height: 40px;
        box-shadow: 0 0 5px rgba(3,33,33,.3);
        transition: all 0.3s;
    }
    .blue .hero-button {
        border: 3px solid #DBE3FF;
    }

    .hero-button:hover {
        background-color: #AFCB17;
        scale: 1.05;
        box-shadow: 0 0 18px rgba(3,33,33,.3);
        color: #fff;
    }

    .hero-button .basket-icon {
        transition: all 0.3s;
        transform: rotate(15deg);
        margin-left: 5px;
    }

    .hero-button:hover .basket-icon {
        transform: rotate(-10deg)
    }

    .hero-button .star-start {
        position: relative;
        top: -3px;
    }

    .hero-button .swoosh-container {
        display: flex;
        align-items: center;
        justify-content: end;
        margin-right: 5px;
        width: 25px;
    }

    .hero-button .swoosh {
        display: block;
        width: 0;
        height: 3px;
        margin-top: -3px;
        margin-left: -2px;
        transform: rotate(15deg);
        background-color: rgba(255, 255, 255, 0.7);
        transition: all 0.3s;
    }

    .hero-button:hover .swoosh {
        width: 7px;
    }

    .hero-button .star-end {
        position: relative;
        bottom: -5px;
        transition: all 0.3s;
    }

    .hero-button:hover .star-end {
        scale: 1.1;
        transform: rotate(30deg);
    }

    @media (min-width: 768px) {
        .hero-panels .flickity-viewport {
            aspect-ratio: 900/280;
        }

        .hero-panels .carousel-cell {
            flex-direction: row;
            flex-flow: row-reverse;
        }

        .hero-panels .carousel-cell .media {
            width: 50%;
            aspect-ratio: 450/280;
        }

        .hero-panels .carousel-cell .hero-tile-info {
            padding: 20px 20px 20px 40px;
            margin-top: 0;
            margin-right: -20px;
            width: calc(50% + 20px);
        }

        .hero-panels .carousel-cell .hero-tile-info .brand-logo {
            position: relative;
            top: 0;
            margin-bottom: 20px;
            height: 90px;
        }

        .hero-panels .carousel-cell .hero-tile-info h2 {
            font-size: 24px;
            margin: 0;
        }

        .hero-panels .carousel-cell .hero-tile-info .hero-blurb {
            display: block;
            margin: 12px 0;
        }
    }

    /* Footer color override and main page margin fix DO NOT DELETE */
    footer {
        background-color: #dbe3ff;
    }

    .section1 {
        margin-bottom: 0;
    }

    .section1 + .row.no-margin {
        display: none;
    }
