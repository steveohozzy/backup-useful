  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    const adminEmails = [
      "steve.hoskins@theentertainer.com",
      "hasina.bhatti@theentertainer.com"
    ];

    // Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCDZV0dYL32XUo0i_VXEcqDC-YI7M9GaVk",
  authDomain: "comp-image-upload.firebaseapp.com",
  projectId: "comp-image-upload",
  storageBucket: "comp-image-upload.firebasestorage.app",
  messagingSenderId: "1075579373754",
  appId: "1:1075579373754:web:de8c1e266ac0ba1323da83"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

    const form = document.getElementById("uploadForm");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("image");
    const fileLabel = document.querySelector(".custom-file-label");

    const CLOUD_NAME = "dzo7qxreh";
    const UPLOAD_PRESET = "world-cup-comp";

    // Update file label
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        fileLabel.textContent = fileInput.files[0].name;
      } else {
        fileLabel.textContent = "Choose File";
      }
    });

    form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const file = fileInput.files[0];
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;

  if (!file) return alert("Please select an image");

  status.textContent = "Uploading image...";

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    if (!data.secure_url) throw new Error("Image upload failed");

    const imageUrl = data.secure_url;

    // Show uploaded image
    preview.src = imageUrl;
    preview.style.display = "block";

    status.textContent = "Saving entry to database...";

    await addDoc(collection(db, "submissions"), {
      imageUrl,
      name,
      email,
      phone,
      address,
      createdAt: serverTimestamp()
    });

    // ✅ Replace only form fields with thank-you message
    form.innerHTML = `<p style="text-align:center; font-size:18px; color:#1f2b91; font-weight:bold; margin: 20px 0;">
                        Thanks for your entry and good luck!
                      </p>`;

    // Update status message
    status.textContent = "✅ Entry submitted successfully!";

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Something went wrong!";
  }
});

function showLogin() {
  return new Promise((resolve) => {
    const modal = document.createElement("div");
    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0,0,0,0.5)";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.style.zIndex = "99999";

    modal.innerHTML = `
      <div style="background:#fff;padding:20px;border-radius:8px;width:300px;">
        <h3>Admin Login</h3>
        <input id="loginEmail" placeholder="Email" style="width:100%;margin-bottom:10px;" />
        <input id="loginPass" type="password" placeholder="Password" style="width:100%;margin-bottom:10px;" />
        <button id="loginBtn">Login</button>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById("loginBtn").onclick = async () => {
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("loginEmail").value,
          document.getElementById("loginPass").value
        );

        modal.remove();
        resolve(true);

      } catch (err) {
        alert("Login failed");
      }
    };
  });
}

async function exportCSV() {
  const querySnapshot = await getDocs(collection(db, "submissions"));

  const rows = [];
  rows.push(["Image URL","Name","Email","Phone","Address","Created At"].join(","));

  querySnapshot.forEach(doc => {
    const data = doc.data();
    const createdAt = data.createdAt?.toDate ? data.createdAt.toDate().toISOString() : "";

    rows.push([
      `"${data.imageUrl || ""}"`,
      `"${data.name || ""}"`,
      `"${data.email || ""}"`,
      `"${data.phone || ""}"`,
      `"${data.address || ""}"`,
      `"${createdAt}"`
    ].join(","));
  });

  const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "submissions.csv";
  a.click();

  URL.revokeObjectURL(url);
}

    if (window.location.search.includes("download")) {

  const downloadBtn = document.createElement("button");
  downloadBtn.textContent = "Download CSV";
  downloadBtn.classList.add("download-btn");
  document.body.appendChild(downloadBtn);

  downloadBtn.addEventListener("click", async () => {

    // ❌ BLOCK 1: must be logged in
    if (!auth.currentUser) {
      await showLogin();
      return;
    }

    // ❌ BLOCK 2: must be admin email
    const email = auth.currentUser.email;

    if (!adminEmails.includes(email)) {
      alert("Not authorised");
      return;
    }

    // ✅ allowed → export
    exportCSV();

  });
}
