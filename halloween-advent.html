<style>
  * { box-sizing:border-box; margin:0; padding:0; }
body { background:#000; font-family: Arial,sans-serif; min-height:100vh; color:#ff6600; }

/* GRID */
.grid { display:grid; gap:14px; padding:14px; }
@media(min-width:900px){ .grid{grid-template-columns: repeat(3,1fr);} }
@media(max-width:899px){ .grid{grid-template-columns: repeat(2,1fr);} }
@media(max-width:500px){ .grid{grid-template-columns: 1fr;} }

/* CELL */
.cell {
  position:relative; height:220px; overflow:hidden;
  background:#1a1a1a; border:3px solid #111; border-radius:4px;
  box-shadow:0 0 25px rgba(255,102,0,0.5);
}

/* LABEL */
.label {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:3.2rem; font-weight:bold;
  color: rgba(81, 40, 136, 0.95);
  text-shadow: 0 0 10px rgba(81, 40, 136,.5);
  pointer-events:none; z-index:510;
}

/* LOCKED */
.cell.locked { filter:brightness(0.5); }
.cell.locked::after {
  content:'CLOSED'; position:absolute; inset:0;
  display:grid; place-items:center; font-size:1.2rem; letter-spacing:3px;
  background: rgba(0,0,0,.6); color:orange; font-family:'Creepster', cursive;
  z-index:6;
}

/* DOORS */
.doors { position:absolute; inset:0; }
.door {
  position:absolute; top:0; width:50%; height:100%;
  background:
    linear-gradient(to right, rgba(0,0,0,.35), transparent 15%, transparent 85%, rgba(0,0,0,.35)),
    repeating-linear-gradient(
      to bottom,
      #4b2e1e 0px,
      #4b2e1e 40px,
      #362210 40px,
      #362210 45px
    );
  border:1px solid #221100;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
  transition: transform 1.5s cubic-bezier(.77,0,.18,1);
  display:flex; justify-content:center; align-items:flex-end;
  overflow:visible;
  transform-origin: left;
}

.door {
  width: 50%;
  height: 100%;
  position: absolute;
  top: 0;
   position:absolute; top:0; width:50%; height:100%;
  background:
    linear-gradient(to right, rgba(0,0,0,.35), transparent 15%, transparent 85%, rgba(0,0,0,.35)),
    repeating-linear-gradient(
      to bottom,
      #4b2e1e 0px,
      #4b2e1e 40px,
      #362210 40px,
      #362210 45px
    );
  border:1px solid #221100;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
  transform-origin: left center; /* left door swings from left edge */
  transition: transform 0.8s ease-in-out;
  z-index: 2;
}

.door.right {
  right: 0;
  left: auto;
  transform-origin: right center; /* right door swings from right edge */
}

.cell.open .door.left {
  transform: rotateY(-90deg); /* swings outward */
}

.cell.open .door.right {
  transform: rotateY(90deg); /* swings outward */
}

.right { right:0; transform-origin:right; }

/* Handles */
.handle {
  width:28px; height:28px;
  border-radius:50%;
  position:absolute;
  top:50%; transform:translateY(-50%);
  background: radial-gradient(circle at 30% 30%, #d4af37, #8c6b1f);
  border: 3px solid #8c6b1f;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.7), 0 0 4px rgba(0,0,0,0.5);
  z-index:11; /* above candles and numbers */
}
.left .handle { right:5px; }
.right .handle { left:5px; }

/* Candles */
.candle {
  width:8px; height:25px;
  background:#f5f1e6; border-radius:3px;
  position:absolute; bottom:2px; z-index:10;
}
.candle::after {
  content:'';
  position:absolute;
  top:-12px; left:50%; transform:translateX(-50%);
  width:12px; height:18px;
  background: radial-gradient(circle at 50% 30%, #fff 0%, #ffae00 40%, #ff5e00 70%, transparent 80%);
  border-radius:50%;
  animation: flameFlicker 1.2s infinite ease-in-out;
}
@keyframes flameFlicker {
  0%,100% { transform:translateX(-50%) scale(1); }
  50% { transform:translateX(-50%) scale(1.15); }
}

/* Door Numbers */
.door-number {
  position:absolute; top:15px;
  font-family:'Creepster', cursive;
  font-size:1.5rem; font-weight:bold;
  color:purple; z-index:10;
}

/* Spiders and cobwebs using SVGs */
.spider, .cobweb {
  position:absolute;
  width:24px; height:24px;
  z-index:9;
  pointer-events:none;
  animation: float 10s infinite alternate ease-in-out;
  transition: transform 1.5s cubic-bezier(.77,0,.18,1);
}
.spider svg, .cobweb svg { width:100%; height:100%; }

@keyframes float {
  0% { transform: translate(0,0) rotate(0deg); }
  50% { transform: translate(4px,4px) rotate(5deg); }
  100% { transform: translate(-4px,4px) rotate(-5deg); }
}

.cobweb {
  width: 120px;
  height: 120px;
}

/* Move spiders/cobwebs with doors */
.cell.open .spider, .cell.open .cobweb {
  transform: translateX(-100%) translateY(0); /* approximate sliding with door */
  opacity:0.9;
}

/* CLAIMED */
.cell.claimed { border-color:#ff6600; box-shadow:0 0 20px rgba(255,102,0,0.5); }

/* SHAKE */
.shake { animation:shake 0.4s; }
@keyframes shake{
  0%{transform:translateX(0) rotateZ(0deg);}
  20%{transform:translateX(-2px) rotateZ(-1deg);}
  40%{transform:translateX(2px) rotateZ(1deg);}
  60%{transform:translateX(-1px) rotateZ(-0.5deg);}
  80%{transform:translateX(1px) rotateZ(0.5deg);}
  100%{transform:translateX(0) rotateZ(0deg);}
}

/* MODAL */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; place-items:center; z-index:50; }
.modal.show{display:grid;}
.modal-inner {
  width: 90%; max-width:450px; background: radial-gradient(circle at center, rgba(0,0,0,0.6) 0%, transparent 90%);
  padding:20px; text-align:center; color:#ff6600;
  box-shadow:0 0 80px rgba(255,102,0,0.5); font-family:'Creepster', cursive;
  position:relative;
}
.close{
  position:absolute; top:10px; right:10px;
  background:none; border:none; color:orange;
  font-size:1.8rem; cursor:pointer; z-index:10;
}
.crawl-wrapper { margin-bottom:10px; }
.offer-code {
  display:flex; justify-content:center; align-items:center; gap:8px;
}
#offerCode {
  border:none; background:rgba(0,0,0,0.3); color:#ff6600; padding:5px 10px;
  font-family:'Creepster', cursive; font-size:1rem; text-align:center;
  width:160px;
}
#offerCode:focus { outline:none; }
#copyBtn {
  background:black; border:2px solid #ff6600; color:#ff6600; padding:5px 12px; cursor:pointer;
}
#copyBtn:hover { background:#ff6600; color:black; }

/* Random spider crawl: move around slightly even if door closed */
@keyframes spiderCrawl {
  0% { transform: translate(0px,0px); }
  25% { transform: translate(5px,-3px); }
  50% { transform: translate(-4px,4px); }
  75% { transform: translate(3px,2px); }
  100% { transform: translate(0px,0px); }
}
.spider.random-crawl { animation: spiderCrawl 5s infinite ease-in-out; }


/* Smoke wrapper */
.doors .fog {
  position: absolute;
  top: 100%;
  left: 50%;
  width: 120%;
  height: 120%;
  transform: translateX(-50%);
  pointer-events: none;
  z-index: 0; /* behind the doors */
}

/* Individual smoke blobs */
.doors .fog .smoke {
  position: absolute;
  background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.2) 70%);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  filter: blur(20px);
  opacity: 0;
  animation: riseSmoke 5s infinite ease-in-out;
}

/* Different positions and speeds */
.doors .fog .smoke:nth-child(1) { left: 10%; animation-delay: 0s; }
.doors .fog .smoke:nth-child(2) { left: 40%; animation-delay: 1s; }
.doors .fog .smoke:nth-child(3) { left: 70%; animation-delay: 2s; }
.doors .fog .smoke:nth-child(4) { left: 25%; animation-delay: 3s; }
.doors .fog .smoke:nth-child(5) { left: 55%; animation-delay: 4s; }

/* Smoke rising & drifting animation */
@keyframes riseSmoke {
  0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
  20% { opacity: 0.3; }
  50% { transform: translate(15px, -60px) scale(1.2); opacity: 0.5; }
  70% { transform: translate(-10px, -100px) scale(1.1); opacity: 0.4; }
  100% { transform: translate(0px, -150px) scale(1); opacity: 0; }
}

/* Only show fog when doors are open */
.doors.open .fog .smoke {
  animation-play-state: running;
}

</style>

<div class="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-inner">

    <div class="crawl-wrapper">

  cell.appendChild(doorsWrapper);

  if(claimedDoors.includes(i)) cell.classList.add('claimed');

  if(i===dayOffset){
    cell.addEventListener('click',()=>{ openDoor(cell,i,offer); });
  }

  grid.appendChild(cell);
});

// Door opening
function openDoor(cell,i,offer){
  const leftDoor=cell.querySelector('.door.left'); 
  const rightDoor=cell.querySelector('.door.right');
  
  setTimeout(()=>{
    sound.currentTime=0; sound.play();
  },100);

  cell.classList.remove('open'); void cell.offsetWidth;
    cell.classList.add('open');

  setTimeout(()=>{

    if(!claimedDoors.includes(i)){
      cell.classList.add('claimed'); 
      claimedDoors.push(i);
      localStorage.setItem('claimedDoors',JSON.stringify(claimedDoors));
    }

    setTimeout(()=>{
      crawlText.textContent=offer.text;
      offerCode.value = offer.code;
      modal.classList.add('show');
    },1500);
  },400);
}

// Modal close
document.querySelector('.close').onclick=()=>{
  modal.classList.remove('show');
  const openDoor=grid.querySelector('.cell.open');
  if(openDoor){ openDoor.classList.remove('open'); void openDoor.offsetWidth; }
  setTimeout(()=>{
    sound.currentTime=0; sound.play();
  },100);
};

// Copy button
copyBtn.onclick = ()=>{
  offerCode.select();
  document.execCommand('copy');
  copyBtn.textContent='COPIED';
  setTimeout(()=> copyBtn.textContent='COPY',1500);
};
