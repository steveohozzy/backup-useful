<!-- Store finder and delivery messaging panels -->
 <style type="text/css">
    .store-delivery-container {
        padding: 0;
        background-color: #dbe3ff;
    }

    .store-delivery-panels {
        display: flex;
        flex-flow: column;
        padding: 0 20px 20px;
        max-width: 980px;
        margin: 0 auto;
    }

    .store-delivery-panels .store-finder,
    .store-delivery-panels .delivery-panel {
        background-color: #fff;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .store-delivery-panels .store-finder .store-locator-content {
        display: block;
        width: 100%;
    }

    .store-delivery-panels .store-finder .store-locator-content .store-locator-message {
        display: flex;
        flex-flow: column;
        justify-content: center;
        padding: 20px;
    }

    .store-delivery-panels .store-finder .store-locator-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50px;
        background-color: #EE3224;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
        padding: 10px 30px 10px 10px;
        height: 40px;
        box-shadow: 0 0 5px rgba(3,33,33,.1);
        border: 3px solid #DBE3FF;
        width: 100%;
        transition: all 0.3s;
    }

    .store-delivery-panels .store-finder .store-locator-button:hover {
        background-color: rgba(238, 50, 36, 0.7);
        scale: 1.05;
        box-shadow: 0 0 18px rgba(3,33,33,.2);
        color: #fff;
    }

    .store-delivery-panels .store-finder .store-locator-button .send-icon {
        transition: all 0.3s;
        transform: rotate(15deg);
        margin-left: 5px;
    }

    .store-delivery-panels .store-finder .store-locator-button:hover .send-icon {
        transform: rotate(-10deg)
    }

    .store-delivery-panels .store-finder .store-locator-button .star-start {
        position: relative;
        top: -3px;
    }

    .store-delivery-panels .store-finder .store-locator-button .swoosh-container {
        display: flex;
        align-items: center;
        justify-content: end;
        margin-right: 5px;
        width: 25px;
    }

    .store-delivery-panels .store-finder .store-locator-button .swoosh {
        display: block;
        width: 0;
        height: 3px;
        margin-top: -3px;
        margin-left: -2px;
        transform: rotate(15deg);
        background-color: rgba(255, 255, 255, 0.7);
        transition: all 0.3s;
    }

    .store-delivery-panels .store-finder .store-locator-button:hover .swoosh {
        width: 7px;
    }

    .store-delivery-panels .store-finder .store-locator-button .star-end {
        position: relative;
        bottom: -5px;
        transition: all 0.3s;
    }

    .store-delivery-panels .store-finder .store-locator-button:hover .star-end {
        scale: 1.1;
        transform: rotate(30deg);
    }

    .store-delivery-panels .delivery-panel {
        position: relative;
        margin-top: 20px;
    }

    .heading-ribbon-container {
        text-align: center;
        position: relative;
    }

    .heading-ribbon {
        position: relative;
        padding: 0 23px;
        display: block;
    }

    .heading-ribbon .delivery-panel-title {
        color: #fff;
        font: 24px/100% "Billy Bold", "Tahoma Bold", sans-serif;
        background-color: #EE3224;
        height: 48px;
        line-height: 48px;
        padding: 0 40px;
        margin: 0;
        text-transform: none;
    }

    .heading-ribbon .ribbon-start {
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
    }

    .heading-ribbon .ribbon-end {
        height: 100%;
        position: absolute;
        right: 0;
        top: 0;
    }

    .heading-ribbon .ribbon-start,
    .heading-ribbon .ribbon-start svg,
    .heading-ribbon .ribbon-end,
    .heading-ribbon .ribbon-end svg {
        height: 100%;
        width: 24px;
    }

    .heading-ribbon .ribbon-end {
        transform: scale(-1, -1);
    }

    .delivery-panel .delivery-icons {
        display: flex;
        align-items: center;
        font-size: 14px;
        height: 100%;
        margin-bottom: 20px;
        margin-top: 20px;
    }

    .delivery-panel .delivery-icons .delivery-icon-title {
        font-weight: bold;
        margin: 10px 0 5px;
    }

    .delivery-panel .delivery-icons .delivery-icon-section {
        width: 50%;
        padding: 10px;
        display: flex;
        flex-flow: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
    }

    .desktop-graphic {
        display: none;
    }

    .store-locator-footer {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    @media (min-width: 768px) {
        .store-delivery-panels .store-finder .store-locator-content {
            display: flex;
            flex-flow: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .store-delivery-panels .store-finder .store-locator-button {
            width: 90%;
        }

        .mobile-graphic { 
            display: none;
        }

        .store-locator-footer .desktop-graphic {
            margin-bottom: 0;
            margin-left: 20px;
        }

        .desktop-graphic {
            margin-bottom: 20px;
            display: block;
        }

        .store-delivery-panels .store-finder .delivery-message {
            margin-bottom: 20px;
        }

        .store-delivery-panels .store-finder .delivery-message .delivery-item.desktop-only {
            display: flex;
        }
    }
 </style>
