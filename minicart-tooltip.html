}

<script>

function loadURL(u) {
    $(".js-mini-cart-container").load("/cart .item__list.item__list__cart", function () {

        const itemCount = document.querySelector(".nav-items-total").textContent;
        console.log(itemCount)
        const prices = document.querySelectorAll(".item__price");

        $(".mini-cart-container .item__list--item").each(function (index, item) {
            const nameEl = item.querySelector(".mini-cart-container .item__name");
            const qtyEl = item.querySelector(".mini-cart-container .item__quantity");
            const priceEl = item.querySelector(".mini-cart-container .item__price");

            if (nameEl && qtyEl && priceEl) {
                nameEl.append(qtyEl);
                nameEl.append(priceEl);
            }

            $("<span>Qty:</span>").insertBefore(
                item.querySelector(".mini-cart-container .js-update-entry-quantity-input")
            );
        });

        // Mini cart header
        $(
            '<div class="mini-cart-header"><span>My Basket</span><span class="item-count">'+ itemCount +' Items</span></div>'
        ).insertBefore(document.querySelector(".mini-cart-container .item__list.item__list__cart"));

        // Subtotal
        $(
            `<div class="total">
                <span>Sub-Total</span>
                <span>${document.querySelector(".js-mini-cart-price").textContent}</span>
            </div>`
        ).appendTo($(".js-mini-cart-container"));

        // Spend more container
        $("<div class='spend-more'></div>").appendTo($(".js-mini-cart-container"));

        // Calculate thresholds
        const subTotalNumber = Number(
            document
                .querySelector(".js-mini-cart-price")
                .textContent.replace(/[^0-9\.-]+/g, "")
        );

        const toFreeStandard = (39.99 - subTotalNumber).toFixed(2);
        const toNextDelivery = (75 - subTotalNumber).toFixed(2);

        const thresholdPrompt = `
            <a href="/c/toys-under-10-pounds" class="deliveryThresholdPrompt inserted">
                <div>You’ve qualified for FREE standard delivery!</div>
                <div class="spend-to-next">Spend £${toNextDelivery} more to qualify for FREE express delivery!</div>
                <span class="expressDisclaimer">Exclusions apply.</span>
                <div class="callToAction">Shop Now</div>
            </a>`;

        const freeDelPrompt = `
            <div class="expressDeliveryQualified inserted">
                You’ve qualified for FREE Next Day delivery!
                <span class="expressDisclaimer">Exclusions apply.</span>
            </div>`;

        const startThreshPrompt = `
            <a href="/c/toys-under-10-pounds" title="Shop Now" class="deliveryThresholdPrompt inserted">
                Spend £${toFreeStandard} more to qualify for FREE standard delivery!
                <div class="callToAction">Shop Now</div>
            </a>`;

        if (subTotalNumber > 39.99 && subTotalNumber < 75) {
            $(".spend-more").after(thresholdPrompt);
        } else if (subTotalNumber > 75) {
            $(".spend-more").after(freeDelPrompt);
        } else {
            $(".spend-more").after(startThreshPrompt);
        }

        // Buttons
        $(
            `<div class="buttons">
                <a href="#" class="continue-shopping btn-secondary">Continue Shopping</a>
                <a href="/cart" id="addToCartButton" class="btn btn-primary">Checkout</a>
            </div>`
        ).insertBefore($(".mini-cart-container .spend-more"));

        // Continue shopping button behavior
        $(".continue-shopping").click(function () {
            $(".mini-cart-container").hide();
            setTimeout(function () {
                $(".mini-cart-container").removeAttr("style");
            }, 100);
            return false;
        });
    });
}

// Delayed initialization
setTimeout(function () {
    loadURL();

    const mutFreeExp = new MutationObserver(function () {
        setTimeout(function () {
            loadURL();
            document.querySelector("#colorbox").style.display = "none";
            document.querySelector(".js-mini-cart-container").classList.toggle("open");
            document.querySelector(".mini-cart-container-wrapper").classList.toggle("open");
            window.scrollTo({ top: 0, behavior: "smooth" });

            setTimeout(function () {
                document.querySelector("#cboxOverlay").click();
            }, 5000);
        }, 500);
    });

    mutFreeExp.observe(document.querySelector(".js-mini-cart-count"), {
        childList: true,
    });

    $(".mini-cart-container").wrap("<div class='mini-cart-container-wrapper'></div>");

    // Close cart when clicking outside
    window.addEventListener("click", function (e) {
        const cart = document.querySelector(".js-mini-cart-container");
        if (cart.classList.contains("open") && cart.contains(e.target)) {
            return;
        } else {
            cart.classList.remove("open");
            document.querySelector(".mini-cart-container-wrapper").classList.remove("open");
        }
    });
}, 1000);


</script>
