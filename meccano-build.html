<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MECCANO // BUILD LAB</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #08090b;
    color: white;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

/* =========================================================
   GAME
========================================================= */

#game {
    position: relative;

    width: 100vw;
    height: 100dvh;

    min-height: 560px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            #34383d 0,
            #151719 35%,
            #08090b 75%
        );
}

/* =========================================================
   BACKGROUND
========================================================= */

.background-grid {
    position: absolute;
    inset: 0;

    opacity: .18;

    background-image:
        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    transform:
        perspective(700px)
        rotateX(60deg)
        scale(1.4);

    transform-origin: center bottom;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 82px;

    padding: 15px 22px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 100;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );
}

.logo {
    font-size:
        clamp(
            24px,
            4vw,
            42px
        );

    font-weight: 900;

    letter-spacing: 3px;

    color: #d51f26;

    text-shadow:
        2px 2px 0 #eee,
        4px 4px 0 #300407,
        0 0 18px rgba(213,31,38,.6);
}

.logo span {
    display: block;

    margin-top: 2px;

    font-size:
        clamp(
            7px,
            1vw,
            10px
        );

    letter-spacing: 4px;

    color: #aaa;

    text-shadow: none;
}

.stats {
    display: flex;
    gap: 25px;
    text-align: right;
}

.stat-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: #888;
}

.stat-value {
    margin-top: 3px;

    font-size: 18px;
    font-weight: 900;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    position: absolute;

    left: 0;
    right: 0;

    top: 82px;
    bottom: 0;

    display: flex;

    gap: 18px;

    padding: 15px 18px 18px;

    z-index: 20;
}

/* =========================================================
   PARTS PANEL
========================================================= */

.parts-panel {
    width:
        clamp(
            210px,
            25vw,
            300px
        );

    flex-shrink: 0;

    border: 1px solid #444;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(35,37,40,.96),
            rgba(12,13,15,.96)
        );

    box-shadow:
        0 15px 40px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);

    padding: 15px;

    overflow: hidden;
}

.panel-title {
    font-size: 11px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #ddd;

    margin-bottom: 4px;
}

.panel-sub {
    font-size: 8px;

    letter-spacing: 1px;

    color: #777;

    margin-bottom: 15px;
}

/* =========================================================
   LEVEL SELECTOR
========================================================= */

.level-selector {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-bottom: 12px;
}

.level-arrow {
    width: 28px;
    height: 28px;

    border: 1px solid #555;
    border-radius: 7px;

    background: #181a1d;
    color: white;

    cursor: pointer;

    font-weight: 900;
}

.level-arrow:hover {
    border-color: #d51f26;
}

.level-name {
    flex: 1;

    min-width: 0;

    text-align: center;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 1px;

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;
}

.level-dots {
    display: flex;
    gap: 3px;

    max-width: 100%;

    overflow: hidden;

    margin-bottom: 12px;
}

.level-dot {
    flex: 1;

    height: 3px;

    min-width: 4px;

    background: #333;

    border-radius: 5px;
}

.level-dot.current {
    background: #d51f26;
}

.level-dot.done {
    background: #42d38f;
}

/* =========================================================
   PARTS
========================================================= */

.parts {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    overflow-y: auto;

    height:
        calc(
            100% - 115px
        );

    padding: 3px;

    scrollbar-width: none;
    touch-action: pan-y;
}

.parts::-webkit-scrollbar {
    display: none;
}

/* =========================================================
   PART CARD
========================================================= */

.part-card {
    position: relative;

    min-height: 82px;

    border: 1px solid #444;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #292c2f,
            #151719
        );

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: grab;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 5px 12px rgba(0,0,0,.35);

    transition:
        transform .15s,
        border-color .15s,
        opacity .15s;

    touch-action: none;
}

.part-card:active {
    cursor: grabbing;
    transform: scale(.96);
}

.part-card:hover {
    border-color: #d51f26;
}

.part-card.used {
    opacity: .22;
    pointer-events: none;
}

.part-name {
    margin-top: 6px;

    font-size: 7px;

    letter-spacing: 1px;

    color: #aaa;

    font-weight: 900;

    text-align: center;
}

/* =========================================================
   COLOURS
========================================================= */

.metal {
    position: relative;

    background:
        linear-gradient(
            to bottom,
            #f0f0f0,
            #9c9c9c 45%,
            #555 55%,
            #c8c8c8
        );

    border: 1px solid #333;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.6),
        0 2px 4px rgba(0,0,0,.6);
}

.red {
    background:
        linear-gradient(
            to bottom,
            #ff5a5f,
            #d51f26 45%,
            #7c1015 55%,
            #ed3b42
        ) !important;
}

.blue {
    background:
        linear-gradient(
            to bottom,
            #61b3ff,
            #2174bb 45%,
            #123e68 55%,
            #4b9be0
        ) !important;
}

.yellow {
    background:
        linear-gradient(
            to bottom,
            #fff27a,
            #e2b51c 45%,
            #805f08 55%,
            #f1ce39
        ) !important;
}

.green {
    background:
        linear-gradient(
            to bottom,
            #6fe29c,
            #25945a 45%,
            #145331 55%,
            #50c980
        ) !important;
}

.black {
    background:
        linear-gradient(
            to bottom,
            #555,
            #222 45%,
            #080808 55%,
            #444
        ) !important;
}

/* =========================================================
   MINI VISUALS
========================================================= */

.mini-beam {
    width: 82px;
    height: 13px;
    border-radius: 2px;
}

.mini-beam::after {
    content: "";

    position: absolute;

    inset: 2px 4px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 13px,
            #555 13px,
            #555 16px
        );
}

.mini-short {
    width: 55px;
    height: 13px;
}

.mini-plate {
    width: 65px;
    height: 28px;

    border-radius: 3px;
}

.mini-plate::after {
    content: "";

    position: absolute;

    inset: 5px;

    background:
        radial-gradient(
            circle,
            #555 0 2px,
            transparent 2.5px
        );

    background-size: 12px 12px;
}

.mini-wheel {
    width: 43px;
    height: 43px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #555 0 16%,
            #ccc 17% 27%,
            #666 28% 38%,
            #222 39% 66%,
            #aaa 67% 72%,
            #222 73%
        );

    border: 3px solid #777;
}

.mini-gear {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #555 0 20%,
            #bbb 21% 38%,
            #666 39% 53%,
            #ccc 54% 63%,
            #666 64%
        );

    border: 4px dotted #ddd;
}

.mini-bolt {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            white,
            #aaa 35%,
            #444 70%
        );

    border: 2px solid #222;
}

.mini-bracket {
    width: 45px;
    height: 35px;

    border: 6px solid #aaa;

    border-top: 6px solid #eee;
    border-right: 6px solid #777;

    transform: skewY(-8deg);
}

.mini-axle {
    width: 70px;
    height: 7px;

    background:
        linear-gradient(
            to bottom,
            #eee,
            #777,
            #ddd
        );

    border-radius: 5px;
}

/* =========================================================
   SPECIAL PARTS
========================================================= */

.mini-hook {
    width: 30px;
    height: 38px;

    border: 5px solid #aaa;
    border-top: 0;

    border-radius:
        0 0 18px 18px;

    position: relative;
}

.mini-hook::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 5px;

    background: #aaa;

    right: -7px;
    bottom: 0;

    transform: rotate(-35deg);
}

.mini-cable {
    width: 5px;
    height: 55px;

    background:
        linear-gradient(
            to right,
            #aaa,
            #333,
            #aaa
        );

    border-radius: 5px;
}

.mini-mast {
    width: 12px;
    height: 58px;

    border-radius: 2px;
}

.mini-blade {
    width: 14px;
    height: 65px;

    border-radius: 7px 7px 2px 2px;

    transform: rotate(-15deg);
}

.mini-prop {
    width: 72px;
    height: 10px;

    border-radius: 50%;

    position: relative;
}

.mini-prop::after {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #222;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);
}

.mini-bucket {
    width: 48px;
    height: 35px;

    background:
        linear-gradient(
            145deg,
            #e8e8e8,
            #777
        );

    border: 4px solid #444;

    clip-path:
        polygon(
            0 0,
            100% 10%,
            82% 100%,
            15% 85%
        );
}

.mini-fork {
    width: 65px;
    height: 30px;

    position: relative;

    border-left: 6px solid #aaa;
}

.mini-fork::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 6px;

    background: #aaa;

    box-shadow:
        0 -12px 0 #aaa;
}

.mini-track {
    width: 62px;
    height: 25px;

    border-radius: 14px;

    background: #222;

    border: 5px solid #555;

    position: relative;
}

.mini-track::after {
    content: "";

    position: absolute;

    inset: 4px;

    border:
        2px dotted #aaa;

    border-radius: 8px;
}

.mini-cab {
    width: 52px;
    height: 42px;

    border:
        5px solid #555;

    border-radius:
        6px 6px 2px 2px;

    background:
        linear-gradient(
            145deg,
            #5b6870,
            #1c2226
        );
}

.mini-cab::after {
    content: "";

    position: absolute;

    inset: 6px;

    border:
        2px solid rgba(255,255,255,.5);
}

.mini-seat {
    width: 40px;
    height: 25px;

    border-radius: 8px 8px 3px 3px;

    background:
        linear-gradient(
            #444,
            #111
        );

    border: 2px solid #777;
}

.mini-body {
    width: 70px;
    height: 28px;

    border-radius:
        12px 5px 5px 12px;

    background:
        linear-gradient(
            145deg,
            #ddd,
            #555
        );

    border: 2px solid #333;
}

.mini-spoiler {
    width: 58px;
    height: 7px;

    background: #d51f26;

    border-radius: 3px;

    position: relative;
}

.mini-spoiler::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 20px;

    background: #555;

    left: 10px;
    top: -15px;

    box-shadow:
        32px 0 #555;
}

.mini-rotor {
    width: 100px;
    height: 7px;

    background:
        linear-gradient(
            to bottom,
            #eee,
            #666,
            #eee
        );

    border-radius: 5px;
}

.mini-tail {
    width: 65px;
    height: 10px;

    background:
        linear-gradient(
            to bottom,
            #ddd,
            #666
        );

    border-radius: 5px;
}

.mini-fist {
    width: 30px;
    height: 35px;

    border-radius: 8px;

    background: #777;

    border: 3px solid #aaa;
}

.mini-head {
    width: 42px;
    height: 38px;

    border-radius: 8px;

    background:
        linear-gradient(
            #ccc,
            #666
        );

    border: 3px solid #333;
}

.mini-antenna {
    width: 5px;
    height: 35px;

    background: #aaa;

    position: relative;
}

.mini-antenna::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #d51f26;

    left: -3px;
    top: -7px;
}

.mini-nose {
    width: 35px;
    height: 15px;

    background: #d51f26;

    clip-path:
        polygon(
            0 100%,
            100% 50%,
            0 0
        );
}

.mini-fin {
    width: 20px;
    height: 55px;

    background: #d51f26;

    clip-path:
        polygon(
            0 100%,
            100% 100%,
            100% 0
        );
}

/* =========================================================
   BLUEPRINT
========================================================= */

.blueprint-area {
    position: relative;

    flex: 1;

    min-width: 0;

    border: 1px solid #3f4549;

    border-radius: 14px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #033c5a,
            #04274d 75%
        );

    box-shadow:
        inset 0 0 80px rgba(36, 67, 109, 0.5),
        0 15px 40px rgba(47, 80, 99, 0.45);
}

.blueprint-grid {
    position: absolute;
    inset: 0;

    opacity: .25;

    background-image:
        linear-gradient(
            #acbcc7 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            #6c7880 1px,
            transparent 1px
        );

    background-size: 30px 30px;
}

.blueprint-title {
    position: absolute;

    top: 15px;
    left: 18px;

    z-index: 5;

    font-size: 11px;

    letter-spacing: 3px;

    font-weight: 900;

    color: #cbd1d4;
}

.blueprint-number {
    position: absolute;

    top: 14px;
    right: 18px;

    font-size: 8px;

    letter-spacing: 2px;

    color: #727b80;
}

/* =========================================================
   MODEL
========================================================= */

#model {
    position: absolute;

    left: 50%;
    top: 52%;

    width:
        min(
            700px,
            82%
        );

    height: 460px;

    transform:
        translate(
            -50%,
            -50%
        );
}

/* =========================================================
   TARGET
========================================================= */

.target {
    position: absolute;

    opacity: .6;

    border:
        2px dashed rgba(255,255,255,.8);

    border-radius: 4px;

    transition:
        opacity .2s,
        border-color .2s,
        background .2s;

    pointer-events: none;
}

.target.ready {
    opacity: .9;

    border-color: #d51f26;

    background:
        rgba(213,31,38,.12);
}

.target.complete {
    opacity: .0;
}

/* =========================================================
   MODEL PART
========================================================= */

.model-part {
    position: absolute;

    opacity: 0;

    transform:
        scale(.85);

    transition:
        opacity .25s,
        transform .25s;

    pointer-events: none;
}

.model-part.visible {
    opacity: 1;

    transform:
        scale(1);
}

/* =========================================================
   MODEL BEAMS
========================================================= */

.model-beam {
    height: 18px;

    background:
        linear-gradient(
            to bottom,
            #f3f3f3,
            #999 45%,
            #555 55%,
            #d5d5d5
        );

    border:
        2px solid #333;

    border-radius: 3px;

    box-shadow:
        inset 0 1px 2px white,
        0 4px 8px rgba(0,0,0,.6);
}

.model-beam::after {
    content: "";

    position: absolute;

    left: 8px;
    right: 8px;

    top: 4px;
    bottom: 4px;

    background:
        radial-gradient(
            circle,
            #444 0 3px,
            transparent 3.5px
        );

    background-size: 24px 10px;
}

.model-short {
    height: 13px;

    background:
        linear-gradient(
            to bottom,
            #f3f3f3,
            #888,
            #ddd
        );

    border: 2px solid #333;

    border-radius: 3px;
}

/* =========================================================
   MODEL PLATE
========================================================= */

.model-plate {
    background:
        linear-gradient(
            145deg,
            #e4e4e4,
            #888
        );

    border: 2px solid #444;

    box-shadow:
        inset 0 1px 3px white,
        0 4px 8px rgba(0,0,0,.6);
}

.model-plate::after {
    content: "";

    position: absolute;

    inset: 8px;

    background:
        radial-gradient(
            circle,
            #444 0 3px,
            transparent 3.5px
        );

    background-size: 24px 20px;
}

/* =========================================================
   WHEEL
========================================================= */

.model-wheel {
    width: 78px;
    height: 78px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #444 0 14%,
            #ddd 15% 25%,
            #777 26% 34%,
            #1c1c1c 35% 65%,
            #999 66% 71%,
            #222 72%
        );

    border: 4px solid #777;

    box-shadow:
        0 6px 12px rgba(0,0,0,.7);
}

/* =========================================================
   TRACK
========================================================= */

.model-track {
    border-radius: 25px;

    background:
        #181818;

    border:
        7px solid #555;

    box-shadow:
        inset 0 0 0 3px #222,
        0 5px 10px black;
}

.model-track::after {
    content: "";

    position: absolute;

    inset: 8px;

    border:
        3px dotted #aaa;

    border-radius: 15px;
}

/* =========================================================
   GEAR
========================================================= */

.model-gear {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #444 0 17%,
            #ddd 18% 32%,
            #666 33% 48%,
            #ddd 49% 59%,
            #555 60%
        );

    border: 5px dotted #eee;

    box-shadow:
        0 4px 8px rgba(0,0,0,.6);
}

/* =========================================================
   AXLE
========================================================= */

.model-axle {
    height: 8px;

    background:
        linear-gradient(
            to bottom,
            #eee,
            #666,
            #ccc
        );

    border-radius: 5px;

    box-shadow:
        0 3px 5px black;
}

/* =========================================================
   SPECIAL MODEL PARTS
========================================================= */

.model-hook {
    width: 30px;
    height: 45px;

    border:
        5px solid #aaa;

    border-top: 0;

    border-radius:
        0 0 20px 20px;
}

.model-cable {
    width: 5px;

    background:
        linear-gradient(
            to right,
            #aaa,
            #333,
            #aaa
        );

    border-radius: 5px;
}

.model-mast {
    width: 14px;

    background:
        linear-gradient(
            90deg,
            #555,
            #eee,
            #555
        );

    border:
        2px solid #222;
}

.model-blade {
    background:
        linear-gradient(
            90deg,
            #ddd,
            #777
        );

    border:
        2px solid #444;

    border-radius:
        8px 8px 2px 2px;
}

.model-prop {
    height: 10px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #eee,
            #555
        );
}

.model-bucket {
    background:
        linear-gradient(
            145deg,
            #e4e4e4,
            #666
        );

    border:
        4px solid #444;

    clip-path:
        polygon(
            0 0,
            100% 10%,
            82% 100%,
            15% 85%
        );
}

.model-fork {
    position: absolute;

    border-left:
        7px solid #aaa;
}

.model-fork::after {
    content: "";

    position: absolute;

    left: -7px;
    bottom: 0;

    width: 80px;
    height: 7px;

    background: #aaa;

    box-shadow:
        0 -15px 0 #aaa;
}

.model-cab {
    background:
        linear-gradient(
            145deg,
            #64737b,
            #20262a
        );

    border:
        5px solid #555;

    border-radius:
        8px 8px 2px 2px;
}

.model-cab::after {
    content: "";

    position: absolute;

    inset: 7px;

    border:
        2px solid rgba(255,255,255,.45);
}

.model-seat {
    background:
        linear-gradient(
            #444,
            #111
        );

    border:
        3px solid #777;

    border-radius:
        8px 8px 3px 3px;
}

.model-body {
    border-radius:
        14px 5px 5px 14px;

    border:
        3px solid #333;

    background:
        linear-gradient(
            145deg,
            #ddd,
            #555
        );
}

.model-spoiler {
    background: #d51f26;

    border-radius: 3px;
}

.model-rotor {
    height: 7px;

    background:
        linear-gradient(
            to bottom,
            #eee,
            #666,
            #eee
        );

    border-radius: 5px;
}

.model-tail {
    height: 10px;

    background:
        linear-gradient(
            to bottom,
            #ddd,
            #666
        );

    border-radius: 5px;
}

.model-head {
    background:
        linear-gradient(
            #ccc,
            #666
        );

    border:
        3px solid #333;

    border-radius: 8px;
}

.model-fist {
    background: #777;

    border:
        3px solid #aaa;

    border-radius: 8px;
}

.model-antenna {
    width: 5px;

    background: #aaa;
}

.model-antenna::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #d51f26;

    left: -3px;
    top: -7px;
}

/* =========================================================
   COLOURED MODEL PARTS
========================================================= */

.model-part.red {
    border-color: #570b0f;
}

.model-part.blue {
    border-color: #123653;
}

.model-part.yellow {
    border-color: #66500a;
}

.model-part.green {
    border-color: #16472d;
}

/* =========================================================
   DRAGGING
========================================================= */

.dragging {
    position: fixed !important;

    z-index: 1000 !important;

    pointer-events: none !important;

    transform:
        translate(-50%, -50%)
        scale(1.1) !important;

    opacity: .92 !important;

    filter:
        drop-shadow(
            0 10px 15px rgba(0,0,0,.6)
        );
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 18px;
    right: 150px;

    bottom: 19px;

    height: 5px;

    background:
        rgba(255,255,255,.08);

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #d51f26,
            #42d38f
        );

    transition:
        width .25s ease;
}

/* =========================================================
   RESET
========================================================= */

.reset {
    position: absolute;

    right: 18px;
    bottom: 16px;

    z-index: 30;

    border: 1px solid #555;

    border-radius: 999px;

    padding: 11px 20px;

    background: #181a1d;

    color: white;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;
}

.reset:hover {
    border-color: #d51f26;
}

/* =========================================================
   COMPLETE
========================================================= */

#complete {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(4,7,6,.86);

    backdrop-filter:
        blur(6px);

    text-align: center;
}

.complete-box {
    animation:
        completeIn .5s ease-out;
}

.complete-title {
    font-size:
        clamp(
            42px,
            8vw,
            80px
        );

    font-weight: 900;

    color: #42d38f;

    letter-spacing: 4px;

    text-shadow:
        0 0 30px rgba(66,211,143,.7);
}

.complete-sub {
    margin-top: 10px;

    color: #bbb;

    letter-spacing: 3px;

    font-size: 11px;
}

.complete-next {
    margin-top: 22px;

    display: inline-block;

    border: 1px solid #555;

    border-radius: 999px;

    padding: 12px 22px;

    background: #181a1d;

    color: white;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 2px;

    cursor: pointer;
}

@keyframes completeIn {

    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    #game {
        min-height: 600px;
    }

    .header {
        height: 70px;
        padding: 10px 12px;
    }

    .logo {
        font-size: 20px;
        letter-spacing: 2px;
    }

    .logo span {
        display: none;
    }

    .stats {
        gap: 10px;
    }

    .stat-label {
        font-size: 6px;
    }

    .stat-value {
        font-size: 13px;
    }

    .main {
        top: 70px;

        padding: 8px;

        gap: 8px;

        flex-direction: column;
    }

    .parts-panel {
        width: 100%;

        height: 145px;

        padding: 9px;
    }

    .panel-title {
        font-size: 9px;
    }

    .panel-sub {
        display: none;
    }

    .level-selector {
        margin-bottom: 6px;
    }

    .level-dots {
        margin-bottom: 6px;
    }

    .parts {
        height: 76px;

        display: flex;

        gap: 7px;

        overflow-x: auto;
        overflow-y: hidden;
        touch-action: pan-x;
    }

    .part-card {
        min-width: 72px;
        min-height: 72px;
    }

    .part-name {
        font-size: 6px;
    }

    .blueprint-area {
        flex: 1;
        min-height: 0;
    }

    #model {
        width: 96%;
        height: 350px;
    }

    .model-wheel {
        width: 58px;
        height: 58px;
    }

    .progress {
        left: 10px;
        right: 115px;
        bottom: 12px;
    }

    .reset {
        right: 10px;
        bottom: 8px;

        padding: 9px 13px;

        font-size: 8px;
    }

    .blueprint-title {
        left: 10px;
        top: 10px;

        font-size: 8px;

        letter-spacing: 2px;
    }

    .blueprint-number {
        right: 10px;
        top: 11px;

        font-size: 6px;
    }
}

/* =========================================================
   LEVEL DOTS
========================================================= */

function buildLevelDots() {

    levelDots.innerHTML = "";

    for (
        var i = 0;
        i < LEVELS.length;
        i++
    ) {

        var dot =
            document.createElement("div");

        dot.className =
            "level-dot";

        if (i < currentLevel) {
            dot.classList.add("done");
        }

        if (i === currentLevel) {
            dot.classList.add("current");
        }

        levelDots.appendChild(dot);
    }
}


/* =========================================================
   BUILD LEVEL
========================================================= */

function loadLevel(index) {

    if (
        index < 0 ||
        index >= LEVELS.length
    ) {
        return;
    }

    currentLevel = index;

    var level =
        LEVELS[currentLevel];

    placed = 0;

    complete.style.display =
        "none";

    levelName.textContent =
        level.name;

    buildNumber.textContent =
        level.number;

    blueprintTitle.textContent =
        "PROJECT // " +
        level.name;

    blueprintNumber.textContent =
        "DRAWING NO. " +
        level.short +
        "-" +
        level.number;

    completeSub.textContent =
        level.name +
        " // ASSEMBLY " +
        level.number;

    buildLevelDots();

    buildParts();

    buildModel();

    updateProgress();
}


/* =========================================================
   BUILD PARTS TRAY
========================================================= */

function buildParts() {

    partsContainer.innerHTML =
        "";

    var level =
        LEVELS[currentLevel];

    for (
        var i = 0;
        i < level.parts.length;
        i++
    ) {

        var part =
            level.parts[i];

        var card =
            document.createElement("div");

        card.className =
            "part-card";

        card.dataset.id =
            part.id;

        var visual =
            createVisual(
                part.type,
                part.color
            );

        var name =
            document.createElement("div");

        name.className =
            "part-name";

        name.textContent =
            part.name;

        card.appendChild(
            visual
        );

        card.appendChild(
            name
        );

        partsContainer.appendChild(
            card
        );

        makeDraggable(
            card,
            part
        );
    }
}

actual.className =

/* =========================================================
   DRAGGING
========================================================= */

function makeDraggable(
    card,
    part
) {

    card.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            if (
                card.classList.contains(
                    "used"
                )
            ) {
                return;
            }

            var rect =
                card.getBoundingClientRect();

            var ghost =
                createVisual(
                    part.type,
                    part.color
                );

            ghost.classList.add(
                "dragging"
            );

            document.body.appendChild(
                ghost
            );

            ghost.style.left =
                event.clientX + "px";

            ghost.style.top =
                event.clientY + "px";

            dragging = {

                part: part,

                card: card,

                ghost: ghost,

                offsetX:
                    event.clientX -
                    (
                        rect.left +
                        rect.width / 2
                    ),

                offsetY:
                    event.clientY -
                    (
                        rect.top +
                        rect.height / 2
                    )
            };

            highlightTarget(
                part
            );

            document.addEventListener(
                "pointermove",
                dragMove
            );

            document.addEventListener(
                "pointerup",
                dragEnd
            );

            document.addEventListener(
                "pointercancel",
                dragCancel
            );
        }
    );
}


/* =========================================================
   DRAG MOVE
========================================================= */

function dragMove(event) {

    if (!dragging) {
        return;
    }

    var x =
        event.clientX -
        dragging.offsetX;

    var y =
        event.clientY -
        dragging.offsetY;

    dragging.ghost.style.left =
        x + "px";

    dragging.ghost.style.top =
        y + "px";
}


/* =========================================================
   CLEANUP DRAG LISTENERS & ELEMENTS
========================================================= */

function cleanupDrag() {
    document.removeEventListener(
        "pointermove",
        dragMove
    );
    document.removeEventListener(
        "pointerup",
        dragEnd
    );
    document.removeEventListener(
        "pointercancel",
        dragCancel
    );

    clearTargetHighlights();
}


/* =========================================================
   DRAG CANCEL (Fixes stuck ghost pieces on mobile)
========================================================= */

function dragCancel(event) {

    if (!dragging) {
        cleanupDrag();
        return;
    }

    dragging.ghost.remove();
    dragging = null;

    cleanupDrag();
}


/* =========================================================
   DRAG END
========================================================= */

function dragEnd(event) {

    if (!dragging) {
        cleanupDrag();
        return;
    }

    var current =
        dragging;

    dragging =
        null;

    cleanupDrag();

    var target =
        document.querySelector(
            '.target[data-part="' +
            current.part.id +
            '"]'
        );

    if (!target) {

        current.ghost.remove();

        return;
    }

    var targetRect =
        target.getBoundingClientRect();

    var targetX =
        targetRect.left +
        targetRect.width / 2;

    var targetY =
        targetRect.top +
        targetRect.height / 2;

    var distance =
        Math.sqrt(
            Math.pow(
                event.clientX -
                targetX,
                2
            ) +
            Math.pow(
                event.clientY -
                targetY,
                2
            )
        );

    current.ghost.remove();

    /*
        Generous snap range.

        This is especially important
        on mobile.
    */

    if (
        distance <
        Math.max(
            70,
            targetRect.width * .45,
            targetRect.height * .7
        )
    ) {

        placePart(
            current.part,
            current.card,
            target
        );
    }
}


/* =========================================================
   TARGET HIGHLIGHT
========================================================= */

function highlightTarget(part) {

    clearTargetHighlights();

    var target =
        document.querySelector(
            '.target[data-part="' +
            part.id +
            '"]'
        );

    if (target) {

        target.classList.add(
            "ready"
        );
    }
}


/* =========================================================
   CLEAR TARGETS
========================================================= */

function clearTargetHighlights() {

    var targets =
        document.querySelectorAll(
            ".target.ready"
        );

    for (
        var i = 0;
        i < targets.length;
        i++
    ) {

        targets[i].classList.remove(
            "ready"
        );
    }
}


/* =========================================================
   PLACE PART
========================================================= */

function placePart(
    part,
    card,
    target
) {

    card.classList.add(
        "used"
    );

    target.classList.remove(
        "ready"
    );

    target.classList.add(
        "complete"
    );

    var modelPart =
        document.getElementById(
            "model-" +
            part.id
        );

    if (modelPart) {

        modelPart.classList.add(
            "visible"
        );

        /*
            Keep rotation after
            revealing the model.
        */

        if (part.rotate) {

            modelPart.style.transform =
                "rotate(" +
                part.rotate +
                "deg) scale(1)";
        }
    }

    placed++;

    updateProgress();

    /*
        Placement pulse
    */

    target.animate(
        [
            {
                transform:
                    "scale(.9)"
            },

            {
                transform:
                    "scale(1.12)"
            },

            {
                transform:
                    "scale(1)"
            }
        ],
        {
            duration: 280
        }
    );

    /*
        Complete level
    */

    if (
        placed ===
        LEVELS[currentLevel].parts.length
    ) {

        setTimeout(
            completeBuild,
            600
        );
    }
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    var total =
        LEVELS[currentLevel].parts.length;

    partsCount.textContent =
        placed +
        " / " +
        total;

    progressBar.style.width =
        (
            placed /
            total *
            100
        ) + "%";
}


/* =========================================================
   COMPLETE BUILD
========================================================= */

function completeBuild() {

    complete.style.display =
        "flex";

    var visibleParts =
        document.querySelectorAll(
            ".model-part.visible"
        );

    for (
        var i = 0;
        i < visibleParts.length;
        i++
    ) {

        visibleParts[i].animate(
            [
                {
                    filter:
                        "brightness(1)"
                },

                {
                    filter:
                        "brightness(1.8)"
                },

                {
                    filter:
                        "brightness(1)"
                }
            ],
            {
                duration: 900,

                delay:
                    i * 45,

                iterations: 2
            }
        );
    }

    if (
        currentLevel ===
        LEVELS.length - 1
    ) {

        nextBuild.textContent =
            "REBUILD SUPER MACHINE";
    }

    else {

        nextBuild.textContent =
            "NEXT BUILD";
    }
}


/* =========================================================
   RESET
========================================================= */

function resetBuild() {

    placed = 0;

    complete.style.display =
        "none";

    buildParts();

    buildModel();

    updateProgress();
}


/* =========================================================
   NEXT LEVEL
========================================================= */

function goNext() {

    if (
        currentLevel <
        LEVELS.length - 1
    ) {

        loadLevel(
            currentLevel + 1
        );
    }

    else {

        loadLevel(0);
    }
}


/* =========================================================
   PREVIOUS LEVEL
========================================================= */

function goPrevious() {

    if (
        currentLevel > 0
    ) {

        loadLevel(
            currentLevel - 1
        );
    }
}


/* =========================================================
   BUTTONS
========================================================= */

resetButton.addEventListener(
    "click",
    resetBuild
);

nextBuild.addEventListener(
    "click",
    goNext
);

nextLevel.addEventListener(
    "click",
    goNext
);

prevLevel.addEventListener(
    "click",
    goPrevious
);

========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight"
        ) {

            goNext();
        }

        if (
            event.key === "ArrowLeft"
        ) {

            goPrevious();
        }

        if (
            event.key === "r" ||
            event.key === "R"
        ) {

            resetBuild();
        }
    }
);


/* =========================================================
   START
========================================================= */

loadLevel(0);

</script>
