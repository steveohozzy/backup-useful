<style type="text/css">
  .offer-pods {
    padding: 0 20px 20px;
    background-color: #dbe3ff;
  }

  .offer-pods .carousel {
    padding: 0 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .offer-pods .carousel .item {
    padding: 0;
  }

  .offer-pods .carousel-cell {
    width: 78%;
    padding-top: 10px;
  }

  .offer-pods img {
    width: 100%;
    margin: 0 !important;
  }

  .offer-pods a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    flex-grow: 1;
    text-align: center;
    border-radius: 8px;
    padding: 0 0 20px;
    background-color: #fff;
    color: #00548b;
    text-decoration: none;
    font-size: 18px;
    font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
    font-weight: bold;
    color: #00548b;
    margin: 0 20px 0 0;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.05);
    letter-spacing: 0.5px;
    transition: all 0.3s;
    overflow: hidden;
  }

  .offer-pods a:hover {
    box-shadow: 0 0 18px rgba(33, 33, 33, 0.15);
    transform: translateY(-5px);
  }

  .offer-pods a span {
    margin: 20px 0;
  }

  .offer-pods .flickity-button,
  .offer-pods .flickity-page-dots {
    display: none;
  }

  @media (min-width: 768px) {
    .offer-pods .carousel-cell {
      width: 37%;
    }

    .offer-pods a {
      font-size: 20px;
    }
  }

  @media (min-width: 1024px) {
    .offer-pods a {
      font-size: 22px;
    }
  }

  .offer-pods .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    margin-top: 40px;
    margin-bottom: 30px;
    background-color: #009e44;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px 10px 10px 0px;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.6);
    border: 3px solid #ffffff;
    transition: all 0.3s;
  }

  .offer-pods .hero-button:hover {
    background-color: #afcb17;
    scale: 1.05;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
  }

  .offer-pods .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .offer-pods .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .offer-pods .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .offer-pods .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .offer-pods .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: 15px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .offer-pods .hero-button:hover .swoosh {
    width: 7px;
  }

  .offer-pods .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .offer-pods .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .offer-pods .pod1 {
    color: #fff;
    background-color: #0a0a0a;
  }

  .offer-pods .pod2 {
    color: #ffffff;
    background-color: #0a0a0a;
  }

  .offer-pods .pod3 {

  }

  }

    background-color: #0a0a0a;
  }

    background-color: #0a0a0a;
  }

  .lightrope {
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    margin: -15px 0 0 0;
    padding: 0;
    pointer-events: none;
    width: 100%;
  }
  .lightrope li {
    position: relative;
    -webkit-animation-fill-mode: both;
    animation-fill-mode: both;
    -webkit-animation-iteration-count: infinite;
    animation-iteration-count: infinite;
    list-style: none;
    margin: 0;
    padding: 0;
    display: block;
    width: 12px;
    height: 28px;
    border-radius: 50%;
    margin: 20px;
    display: inline-block;
    background: #AAFF00;
    box-shadow: 0px 4.6666666667px 24px 3px #AAFF00;
    -webkit-animation-name: flash-1;
    animation-name: flash-1;
    -webkit-animation-duration: 2s;
    animation-duration: 2s;
  }
  .lightrope li:nth-child(2n + 1) {
    background: #00FFFF;
    box-shadow: 0px 4.6666666667px 24px 3px rgba(0, 255, 255, 0.5);
    -webkit-animation-name: flash-2;
    animation-name: flash-2;
    -webkit-animation-duration: 0.4s;
    animation-duration: 0.4s;
  }
  .lightrope li:nth-child(4n + 2) {
    background: #ff1414;
    box-shadow: 0px 4.6666666667px 24px 3px #ff1414;
    -webkit-animation-name: flash-3;
    animation-name: flash-3;
    -webkit-animation-duration: 1.1s;
    animation-duration: 1.1s;
  }
  .lightrope li:nth-child(odd) {
    -webkit-animation-duration: 1.8s;
    animation-duration: 1.8s;
  }
  .lightrope li:nth-child(3n + 1) {
    -webkit-animation-duration: 1.4s;
    animation-duration: 1.4s;
  }
  .lightrope li:before {
    content: "";
    position: absolute;
    background: #222;
    width: 10px;
    height: 9.3333333333px;
    border-radius: 3px;
    top: -4.6666666667px;
    left: 1px;
  }
  .lightrope li:after {
    content: "";
    top: -14px;
    left: 9px;
    position: absolute;
    width: 52px;
    height: 18.6666666667px;
    border-bottom: solid #222 2px;
    border-radius: 50%;
  }
  .lightrope li:last-child:after {
    content: none;
  }
  .lightrope li:first-child {
    margin-left: -40px;
  }

  @-webkit-keyframes flash-1 {
    0%,
    100% {
      background: #AAFF00;
      box-shadow: 0px 4.6666666667px 24px 3px #AAFF00;
    }
    50% {
      background: rgba(175, 225, 175, 0.4);
      box-shadow: 0px 4.6666666667px 24px 3px rgba(175, 225, 175, 0.2);
    }
  }

  @keyframes flash-1 {
    0%,
    100% {
      background: #AAFF00;
      box-shadow: 0px 4.6666666667px 24px 3px #AAFF00;
    }
    50% {
      background: rgba(175, 225, 175, 0.4);
      box-shadow: 0px 4.6666666667px 24px 3px rgba(175, 225, 175, 0.2);
    }
  }
  @-webkit-keyframes flash-2 {
    0%,
    100% {
      background: #00FFFF;
      box-shadow: 0px 4.6666666667px 24px 3px #00FFFF;
    }
    50% {
      background: rgba(0, 255, 255, 0.4);
      box-shadow: 0px 4.6666666667px 24px 3px rgba(21, 148, 148, 0.5);
    }
  }
  @keyframes flash-2 {
    0%,
    100% {
      background: #00FFFF;
      box-shadow: 0px 4.6666666667px 24px 3px #00FFFF;
    }
    50% {
      background: rgba(0, 255, 255, 0.6);
      box-shadow: 0px 4.6666666667px 24px 3px rgba(21, 148, 148, 0.6);
    }
  }
  @-webkit-keyframes flash-3 {
    0%,
    100% {
      background: #ff1414;
      box-shadow: 0px 4.6666666667px 24px 3px #ff1414;
    }
    50% {
      background: rgba(255,20,20, 0.4);
      box-shadow: 0px 4.6666666667px 24px 3px rgba(255,20,20, 0.5);
    }
  }
  @keyframes flash-3 {
    0%,
    100% {
      background: #ff1414;
      box-shadow: 0px 4.6666666667px 24px 3px #ff1414;
    }
    50% {
      background: rgba(255,20,20, 0.4);

    }
  }
