<!-- Hero Card -->
 <style type="text/css">
    .hero-card-container {
        padding: 0 20px 30px 20px;
        background-color: #dbe3ff;
    }

    .hero-card {
        max-width: 940px;
        margin: 0 auto;
        display: flex;
        flex-flow: column;
        flex-direction: column;
    }

    .hero-card .media {
        aspect-ratio: 335/188;
        border-radius: 8px;
        overflow: hidden;
    }

    .hero-card .media img,
    .hero-card .media iframe,
    .hero-card .media video {
        object-fit: cover;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 2;
    }

    .hero-card .hero-tile-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #d2000f;
        border-radius: 8px;
        position: relative;
        margin-top: -20px;
        padding: 40px 25px 20px 25px;
    }

    .hero-card .hero-tile-info .brand-logo {
        position: absolute;
        top: -32px;
        height: 40px;
        z-index: 2;
    }

    .hero-card .hero-tile-info .brand-logo img,
    .hero-card .hero-tile-info .brand-logo svg {
        height: 100%;
        width: auto;
    }

    .hero-card .hero-tile-info h2 {
        font-size: 20px;
        font-family: "Nunito Bold","Tahoma Bold",sans-serif;
        font-weight: bold;
        color: #fff;
        margin: 0 0 20px;
        line-height: 24px;
    }

    .hero-card .hero-tile-info .hero-blurb {
        color: #fff;
        font-size: 14px;
        font-weight: 200;
        margin-bottom: 20px;
    }

    .hero-card .flickity-viewport {
        aspect-ratio: 335/307;
    }

    .hero-card .hero-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50px;
        background-color: #009E44;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
        padding: 10px 30px 10px 10px;
        height: 40px;
        box-shadow: 0 0 5px rgba(3,33,33,.3);
        border: 3px solid #DBE3FF;
        transition: all 0.3s;
    }

    .hero-card .hero-button:hover {
        background-color: #AFCB17;
        scale: 1.05;
        box-shadow: 0 0 18px rgba(3,33,33,.3);
        color: #fff;
    }

    .hero-card .hero-button .basket-icon {
        transition: all 0.3s;
        transform: rotate(15deg);
        margin-left: 5px;
    }

    .hero-card .hero-button:hover .basket-icon {
        transform: rotate(-10deg)
    }

    .hero-card .hero-button .star-start {
        position: relative;
        top: -3px;
    }

    .hero-card .hero-button .swoosh-container {
        display: flex;
        align-items: center;
        justify-content: end;
        margin-right: 5px;
        width: 25px;
    }

    .hero-card .hero-button .swoosh {
        display: block;
        width: 0;
        height: 3px;
        margin-top: -3px;
        margin-left: -2px;
        transform: rotate(15deg);
        background-color: rgba(255, 255, 255, 0.7);
        transition: all 0.3s;
    }

    .hero-card .hero-button:hover .swoosh {
        width: 7px;
    }

    .hero-card .hero-button .star-end {
        position: relative;
        bottom: -5px;
        transition: all 0.3s;
    }

    .hero-card .hero-button:hover .star-end {
        scale: 1.1;
        transform: rotate(30deg);
    }

    @media (min-width: 768px) {
        .hero-card {
            flex-flow: row-reverse;
            align-items: stretch;
        }

        .hero-card .media {
            width: 50%;
            aspect-ratio: 450/285;
        }

        .hero-card .hero-tile-info {
            padding: 20px 30px 20px 20px;
            margin-top: 0;
            margin-right: -20px;
            width: calc(50% + 20px);
        }

        .hero-card .hero-tile-info .brand-logo {
            position: relative;
            top: 0;
            margin-bottom: 20px;
            height: 90px;
        }

        .hero-card .hero-tile-info h2 {
            font-size: 24px;
            margin: 0;
        }

        .hero-card .hero-tile-info .hero-blurb {
            display: block;
            margin: 12px 0;
        }
    }
 </style>
