<style>
  .carousel-card.swipe-right {
    transform: translateX(120%) rotate(10deg);
    transition: transform 0.4s ease-in-out;
  }

  .carousel-card.swipe-left {
    transform: translateX(-120%) rotate(-10deg);
    transition: transform 0.4s ease-in-out;
  }
  .carousel-wrapper {
    position: relative;
    max-width: 700px;
    width: 100%;
    margin: 0 auto 30px;
  }
  .dragging a {
    pointer-events: none !important;
    text-decoration: none;
  }
  .carousel-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin: 0 auto;
    position: relative;
    max-width: 1200px;
    padding: 0 20px;
  }

  .carousel-stack {
    position: relative;
    width: 100%;
    max-width: 1140px;
    margin: 0 auto;
    cursor: grab;
    touch-action: none;
    overflow: visible;
    border-radius: 24px;
    padding-right: 0;
  }

  .carousel-stack:active {
    cursor: grabbing;
  }

  .carousel-card {
    position: absolute;
    width: 65%;
    height: auto;
    transition:
      transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
      z-index 0s;
    will-change: transform;
    left: 0;
    user-select: none;
  }

  @media (min-width: 768px) {
    .carousel-card {
      width: 55%;
    }
  }

  .carousel-card a {
    pointer-events: none;
    text-decoration: none;
  }

  .carousel-card.top {
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .carousel-card.top a {
    pointer-events: all;
  }

  .card-content {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 20px 20px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
    border: 3px solid transparent;
    background-color: #fff;
    padding: 10px;
    text-align: center;
  }

  .top .card-content {
    border: 3px solid #1f2b91;
  }

  .card-content .card-title {
    font-size: 20px;
    font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
    color: #1f2b91;
    margin: 30px 0;
    transform: scale(0.5);
    transition: all 0.3s;
  }

  @media (max-width: 768px) {
    .card-content .card-title {
      font-size: 16px;
    }
  }

  .top .card-content .card-title {
    transform: scale(1);
  }

  .card-content .media {
    width: 100%;
    height: auto;
    position: relative;
  }

  .card-content .media img.bg-image {
    width: 100%;
    height: auto;
    display: block;
    filter: blur(2px);
    transition: all 0.3s;
  }

  .top .card-content .media img.bg-image {
    filter: blur(0);
  }

  .card-content .media img.overlay {
    position: absolute;
    right: -10px;
    bottom: 50%;
    height: 90%;
    transform: translateX(0%) translateY(50%);
    width: auto;
    transition: all 0.3s;
    min-width: unset;
  }

  .top .card-content .media img.overlay {
    right: 50%;
    transform: translateX(50%)  translateY(50%);
  }

  .card-content .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background-color: #009e44;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px 10px 10px 0;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.3);
    border: 3px solid #dbe3ff;
    transition: all 0.3s;
    margin-bottom: 20px;
    transform: scale(0.52);
  }

  .top .card-content .hero-button {
    transform: scale(1);
  }

  .card-content .hero-button:hover {
    background-color: #1f2b91;
    scale: 1.05;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
  }

  .card-content .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .card-content .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .card-content .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .card-content .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .card-content .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: -3px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .card-content .hero-button:hover .swoosh {
    width: 7px;
  }

  .card-content .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .card-content .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .prev-btn,
  .next-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    z-index: 10;
    background-color: #407ec9;
    color: #fff;
    border-radius: 100%;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    width: 40px;
  }
  .prev-btn {
    left: -10px;
    transform: rotate(-90deg);
  }
  .next-btn {
    right: 0;
    transform: rotate(90deg);
  }
  .prev-btn svg,
  .next-btn svg {
    width: 100%;
    height: 100%;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const stack = document.getElementById("carousel-stack");
    const indicators = document.getElementById("carousel-indicators");
    const prevBtn = document.querySelector(".prev-btn");
    const nextBtn = document.querySelector(".next-btn");
    const slides = document.querySelectorAll(".card-content-container");

    function setEqualHeights() {
      let heroHeight = 0;

      // reset heights first
      slides.forEach((slide) => {
        slide.style.height = "auto";
      });

      // find tallest
      slides.forEach((slide) => {
        if (slide.clientHeight > heroHeight) {
          heroHeight = slide.clientHeight;
        }
      });

      // apply tallest to all
      slides.forEach((slide) => {
        slide.style.height = heroHeight + "px";
      });

      if (stack) {
        stack.style.height = heroHeight + "px";
      }
    }

    setEqualHeights();

    let currentIndex = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragOffset = 0;
    let multiplier = window.innerWidth < 1024 ? 15 : 20;

    let resizeTimer;

    window.addEventListener("load", () => {
      setEqualHeights();
      updateTransforms();
    });

    window.addEventListener("resize", () => {
      multiplier = window.innerWidth < 1024 ? 15 : 20;

      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        setEqualHeights();
        updateTransforms();
      }, 150);
    });

    const cards = Array.from(document.querySelectorAll(".carousel-card"));
    const indicatorButtons = Array.from(
      document.querySelectorAll(".indicator"),
    );
    const cardsElements = document.querySelectorAll(".carousel-card");

    function updateTransforms() {
      const len = cards.length;
      cards.forEach((card, index) => {
        const offset = (index - currentIndex + len) % len;
        const isTop = offset === 0;
        const xOffset = offset * multiplier + (isTop ? dragOffset / 3 : 0);

        card.classList.toggle("top", isTop);
        card.style.transform =
          "translateX(" + xOffset + "%) scale(" + (1 - offset * 0.02) + ")";
        card.style.zIndex = len - offset;
      });

      indicatorButtons.forEach((btn, i) =>
        btn.classList.toggle("active", i === currentIndex),
      );
    }

    function nextCard() {
      const len = cards.length;
      currentIndex = (currentIndex + 1) % len;
      dragOffset = 0;
      updateTransforms();
    }

    function prevCard() {
      const len = cards.length;
      currentIndex = (currentIndex - 1 + len) % len;
      dragOffset = 0;
      updateTransforms();
    }

    if (nextBtn) nextBtn.addEventListener("click", nextCard);
    if (prevBtn) prevBtn.addEventListener("click", prevCard);

    stack.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStartX = e.clientX;
    });

    stack.addEventListener("mousemove", (e) => {
      if (!isDragging) {
        e.currentTarget.classList.remove("dragging");
        return;
      }

      e.currentTarget.classList.add("dragging");
      dragOffset = Math.max(-20, Math.min(20, e.clientX - dragStartX));
      updateTransforms();
    });

    stack.addEventListener("mouseup", (e) => {
      if (!isDragging) {
        e.currentTarget.classList.remove("dragging");
        return;
      }

      isDragging = false;
      e.currentTarget.classList.remove("dragging");

      const deltaX = e.clientX - dragStartX;

      if (deltaX > 20) prevCard();
      else if (deltaX < -20) nextCard();
      else {
        dragOffset = 0;
        updateTransforms();
      }
    });

    stack.addEventListener("mouseleave", () => {
      if (isDragging) {
        isDragging = false;
        dragOffset = 0;
        updateTransforms();
      }
    });

    stack.addEventListener("touchstart", (e) => {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      e.currentTarget.classList.add("dragging");
    });

    stack.addEventListener("touchmove", (e) => {
      if (!isDragging) return;
      dragOffset = e.touches[0].clientX - dragStartX;
      updateTransforms();
    });

    stack.addEventListener("touchend", (e) => {
      isDragging = false;
      e.currentTarget.classList.remove("dragging");

      const deltaX = e.changedTouches[0].clientX - dragStartX;

      if (deltaX > 20) prevCard();
      else if (deltaX < -20) nextCard();
      else {
        dragOffset = 0;
        updateTransforms();
      }
    });

    cardsElements.forEach((banner, index) => {
      banner.addEventListener("mousedown", (e) => {
        if (!e.currentTarget.classList.contains("top")) {
          currentIndex = index;
          dragOffset = 0;
          updateTransforms();
        }
      });
    });

    updateTransforms();
  });
</script>
