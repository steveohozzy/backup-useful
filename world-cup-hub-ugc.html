<style>
  .world-cup-ugc-content {
    margin: 0 auto;
    width: 100%;
    max-width: 1200px;
    padding: 20px;
    text-align: center;
  }

  .world-cup-ugc-content h2 {
    text-transform: uppercase;
    background-color: #1f2b91;
    color: #fff;
    font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
    font-size: 24px;
    border-radius: 8px;
    margin-bottom: 20px;
  }


  .ugc-pods {
      padding: 0 10px 20px;
    }

    .ugc-pods .carousel {
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .ugc-pods .carousel .item {
      padding: 0;
    }

    .ugc-pods img {
      width: 100%;
      margin: 0 0 10px !important;
    }

    .ugc-pods a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      border-radius: 8px;
      padding: 0 0 20px;
      background-color: #fff;
      text-decoration: none;
      font-size: 12px;
      color: #000;
      margin: 0 20px 0 0;
      transition: all 0.3s;
      overflow: hidden;
      height: 100%;
    }


    .ugc-pods .flickity-page-dots {
      display: none;
    }

    .pod-image-container {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .flickity-button {
      box-shadow: none;
      background-color: #407ec9;
      width: 40px !important;
      height: 40px !important;
      padding: 5px;
    }

    .flickity-button:hover {
      background-color: #407ec9;
    }

    .flickity-prev-next-button .flickity-button-icon {
    position: absolute;
    left: 30%;
    top: 30%;
    width: 40%;
    height: 40%;
}
</style>
