<style>
#gaming-shop-by-category-area {
    background-color: #fff;
    max-width: 940px;
    padding: 0 20px;
    margin: 0 auto;
  }
  .gaming-shop-by-category-content {
    margin: 0 auto;
    width: 100%;
    max-width: 900px;
    padding: 10px 0;
    text-align: center;
  }

  .gaming-shop-by-category-content h2 {
    text-transform: uppercase;
    background: linear-gradient(
        180deg, 
        rgba(80, 80, 80, 0.9) 0%, 
        rgba(60, 60, 60, 0.95) 50%, 
        rgba(40, 40, 40, 1) 100%
    );
    color: #fff;
    font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
    font-size: 18px;
    border-radius: 8px;
    margin: 0;
    box-shadow: inset 0 4px 10px rgba(255,255,255,0.1); /* subtle inner highlight */
    backdrop-filter: blur(2px); /* optional slight blur for glass effect */
    -webkit-backdrop-filter: blur(2px);
    padding: 5px 0;
}
.gaming-shop-by-category-categories {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  max-width: 900px;
  margin: 10px auto;
  justify-content: center;
}

.gaming-shop-by-category-categories-item {
  text-align: center;
  width: calc(100% / 3 - 20px);
}
@media (min-width: 768px) {
  .gaming-shop-by-category-categories-item {
    width: calc(100% / 4 - 20px);
  }
}
.gaming-shop-by-category-categories-item-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  aspect-ratio: 1/1;
  border-radius: 8px;
  background-color: transparent;
  position: relative;
  overflow: visible;
  transition: all 0.3s;
  box-shadow: 0 0 0 4px rgba(255,255,255,0);
}

.gaming-shop-by-category-categories-item-link::before {
  content: '';
  position: absolute;
  border-radius: 8px;
  border: 3px solid #999999;
  background: linear-gradient(
        180deg, 
        rgba(200, 200, 200, 0.9) 0%, 
        rgba(180, 180, 180, 0.95) 50%, 
        rgba(160, 160, 160, 1) 100%
    );
  z-index: 1;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transition: all 0.3s;
}

.gaming-shop-by-category-categories-item-link:hover::before {
    border-color: transparent;
    margin: 3px;
    border: none;
    width: calc(100% - 6px);
    height: calc(100% - 6px);
}

/* Gradient shimmer overlay */
.gaming-shop-by-category-categories-item-link::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(
      270deg,
      rgba(255,110,199,0.8),
      rgba(0,255,255,0.8),
      rgba(255,110,199,0.8)
  );
  animation: shimmer 3s linear infinite;
  background-size: 600% 600%;
  z-index: 0;
}

/* Make sure your shimmer keyframes exist */
@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.gaming-shop-by-category-categories-item-link img {
  width: calc(100% - 30px);
  height: calc(100% - 30px);
  object-fit: contain;
  z-index: 2;
}

.gaming-shop-by-category-categories-item .text-link {
  color: #292929;
  font-size: 14px;
  font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
  text-decoration: none;
  display: block;
  padding: 10px 0;
}
</style>
