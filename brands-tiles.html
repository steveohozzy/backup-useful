<style type="text/css">
  .brands-tiles {
    padding: 0;
    background-color: #dbe3ff;
  }

  .brands-tiles-container {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 0 20px 20px;
    max-width: 980px;
    margin: 0 auto;
  }

  .brand-tile {
    width: 25%;
    aspect-ratio: 1/1;
    transition: all 0.3s;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.1);
  }

  .brand-tile:hover {
    box-shadow: 0 0 15px rgba(33, 33, 33, 0.3);
    transform: scale(0.97);
  }

  .brand-tile img {
    object-fit: cover;
    width: 100%;
    height: 100%;
  }

  @media (max-width: 767.99px) {
    .hide-mb {
      display: none;
    }
  }
</style>
