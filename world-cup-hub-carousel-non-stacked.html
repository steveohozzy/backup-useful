<style>
  .carousel-non-stack {
    position: relative;
    width: 100%;
    max-width: 1140px;
    margin: 0 auto;
  }

  .card-content-non-stack .carousel-cell {
    width: 78%;
    padding-top: 10px;
    aspect-ratio: 241/421;
  }

  @media (min-width: 768px) {
  .carousel-non-stack .carousel-cell {
      width: 37%;
      aspect-ratio: 429/620;
    }
  }

  .card-content-non-stack {
    width: calc(100% - 20px);
    height: auto;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 20px 20px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
    border: 3px solid #1f2b91;
    background-color: #fff;
    padding: 10px;
    text-align: center;
  }

  .card-content-non-stack .card-title {
    font-size: 20px;
    font-family: "Nunito Bold", "Tahoma Bold", sans-serif;
    color: #1f2b91;
    margin: 30px 0;
    transform: scale(0.5);
    transition: all 0.3s;
  }

  .card-content-non-stack .card-title {
    transform: scale(1);
  }

  .card-content-non-stack .media {
    width: 100%;
    height: auto;
    position: relative;
  }

  .card-content-non-stack .media img.bg-image {
    width: 100%;
    height: auto;
    display: block;
    transition: all 0.3s;
  }

  .card-content-non-stack .media img.overlay {
    position: absolute;
    bottom: 0;
    height: 90%;
    width: auto;
    transition: all 0.3s;
    min-width: unset;
  }

  .card-content-non-stack .media img.overlay {
    right: 50%;
    transform: translateX(50%);
  }

  .card-content-non-stack .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background-color: #009e44;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px 30px 10px 10px;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.3);
    border: 3px solid #dbe3ff;
    transition: all 0.3s;
    margin-bottom: 20px;
    transform: scale(0.52);
  }

  .card-content-non-stack .hero-button {
    transform: scale(1);
  }

  .card-content-non-stack .hero-button:hover {
    background-color: #1f2b91;
    scale: 1.05;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
  }

  .card-content-non-stack .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .card-content-non-stack .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .card-content-non-stack .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .card-content-non-stack .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .card-content-non-stack .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: -3px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .card-content-non-stack .hero-button:hover .swoosh {
    width: 7px;
  }

  .card-content-non-stack .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .card-content-non-stack .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .carousel-non-stack .flickity-page-dots {
    display: none;
  }
</style>
