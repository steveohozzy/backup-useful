<style>
  .promotional-banner {
    width: 100%;
    max-width: 980px;
    margin: 10px auto;
  }

  .promotional-banner .banner-image {
    display: block;
    width: 100%;
    height: auto;
  }

  .promotional-banner .banner-text {
    padding: 10px;
    text-align: center;
  }

  .promotional-banner .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background-color: #009e44;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px 30px 10px 10px;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.3);
    border: 3px solid #dbe3ff;
    transition: all 0.3s;
  }

  .promotional-banner .hero-button:hover {
    background-color: #afcb17;
    scale: 1.05;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
  }

  .promotional-banner .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .promotional-banner .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .promotional-banner .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .promotional-banner .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .promotional-banner .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: -3px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .promotional-banner .hero-button:hover .swoosh {
    width: 7px;
  }

  .promotional-banner .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .promotional-banner .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .promotional-banner .sign-up-title {
    font-size: 14px;
    margin: 10px;
  }

  @media (min-width: 1024px) {
    .promotional-banner .sign-up-title {
      font-size: 14px;
    }
  }
</style>
