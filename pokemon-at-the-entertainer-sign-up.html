<style>
  .container-sign-up {
    max-width: 980px;
    padding: 20px 20px;
    margin: 0 auto;
  }

  .container-sign-up-content {
    border: 3px solid #fcc80b;
    border-radius: 8px;
  }

  .sign-up-title {
    font-size: 16px;
  }

  @media (min-width: 1024px) {
    .sign-up-title {
      font-size: 24px;
    }
  }

  .sign-up-button {
    max-width: 200px;
    margin: 0 auto;
  }

  .sign-up-button .hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50px;
    background-color: #ec7aac;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px;
    height: 40px;
    box-shadow: 0 0 5px rgba(3, 33, 33, 0.3);
    border: 3px solid #dbe3ff;
    transition: all 0.3s;
    margin: 20px auto;
    width: 100%;
  }

  .sign-up-button .hero-button.no-icons {
    padding: 10px;
  }

  .sign-up-button .hero-button:hover {
    background-color: #41254b;
    box-shadow: 0 0 18px rgba(3, 33, 33, 0.3);
    color: #fff;
    border-color: #fff;
  }

  .sign-up-button .hero-button .basket-icon {
    transition: all 0.3s;
    transform: rotate(15deg);
    margin-left: 5px;
  }

  .sign-up-button .hero-button:hover .basket-icon {
    transform: rotate(-10deg);
  }

  .sign-up-button .hero-button .star-start {
    position: relative;
    top: -3px;
  }

  .sign-up-button .hero-button .swoosh-container {
    display: flex;
    align-items: center;
    justify-content: end;
    margin-right: 5px;
    width: 25px;
  }

  .sign-up-button .hero-button .swoosh {
    display: block;
    width: 0;
    height: 3px;
    margin-top: -3px;
    margin-left: -2px;
    transform: rotate(15deg);
    background-color: rgba(255, 255, 255, 0.7);
    transition: all 0.3s;
  }

  .sign-up-button .hero-button:hover .swoosh {
    width: 7px;
  }

  .sign-up-button .hero-button .star-end {
    position: relative;
    bottom: -5px;
    transition: all 0.3s;
  }

  .sign-up-button .hero-button:hover .star-end {
    scale: 1.1;
    transform: rotate(30deg);
  }

  .container-sign-up #pokeball::before {
    left: 0;
  }

</style>
